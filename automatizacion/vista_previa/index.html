<meta charset="utf-8">
<title>Generador de fichas Leuk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300,0,0&icon_names=image&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="fichas.css">
<style>
/* Mesa de revisión: lista de fichas a la izquierda, la hoja A4 tal como sale del generador a la derecha. */
:root {
  --bg: #eceef0; --panel: #f8f9fa; --fg: #1d2125; --muted: #5d6670; --line: #d5dade;
  --accent: #337ea9; --accent-soft: #dcebf4; --warn: #b4561a; --warn-soft: #fbe9dc;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191c; --panel: #1e2226; --fg: #e4e7ea; --muted: #9aa3ab; --line: #30363c;
  --accent: #6fb0d8; --accent-soft: #1f3646; --warn: #f0a06a; --warn-soft: #3d2718; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16191c; --panel: #1e2226; --fg: #e4e7ea; --muted: #9aa3ab; --line: #30363c;
  --accent: #6fb0d8; --accent-soft: #1f3646; --warn: #f0a06a; --warn-soft: #3d2718; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 16px; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.ver { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.45; }
.ver b { color: var(--fg); font-weight: 500; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
#q { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
#q:focus-visible, .item:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--sans); border: 1px solid transparent; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
#lista { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; margin-inline: -6px; }
.item { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 8px; border-radius: 5px; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent); color: #fff; }
.item[aria-current="true"] .meta { color: #ffffffcc; }
.item .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; }
.item .new { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; align-self: center; }
main { overflow: auto; min-width: 0; padding-block: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: 16px; }
.bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 auto 16px; max-width: 820px; }
.bar h2 { margin: 0; font-size: 20px; font-weight: 600; }
.bar .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.flag { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 2px 8px; }
#zoomwrap { margin: 0 auto; width: fit-content; }
#ficha-stage { gap: 24px; }
.empty { color: var(--muted); text-align: center; padding: 60px 0; }
#volver { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #lista { max-height: 40vh; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
</style>

<div class="app">
  <aside>
    <div class="brand">
      <h1>Generador de fichas</h1>
      <div class="ver" id="ver">Cargando…</div>
    </div>
    <div class="note">Vista previa de la rama en revisión. Nada de esto está publicado en la plataforma ni en Drive.</div>
    <div id="cambios" hidden>
      <div class="lbl">Cambió en esta versión</div>
      <div class="chips" id="chips"></div>
    </div>
    <input id="q" type="search" placeholder="Buscar ficha o SKU" autocomplete="off">
    <div id="lista" role="list"></div>
  </aside>
  <main>
    <div class="bar"><h2 id="tit"></h2><span class="meta" id="meta"></span><span class="flag" id="flag" hidden>Sin foto de producto</span></div>
    <div id="zoomwrap"><div id="ficha-stage" class="f-host"><div class="empty">Elegí una ficha de la lista.</div></div></div>
  </main>
</div>

<script>window.FICHAS = [];</script>
<script src="fichas-ui.js"></script>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  let IDX = { docs: [], cambiadas: [], etiqueta: "" }, actual = null;
  try { IDX = await (await fetch("indice.json")).json(); } catch (e) { $("ver").textContent = "No se pudo cargar el índice."; return; }
  const cambi = new Set(IDX.cambiadas || []);
  $("ver").innerHTML = `<b>${IDX.etiqueta || ""}</b><br>${IDX.docs.length} fichas`;
  if (cambi.size) {
    $("cambios").hidden = false;
    $("chips").innerHTML = [...cambi].filter(a => IDX.docs.some(d => d.ag === a))
      .map(a => `<button class="chip" data-ag="${a.replace(/"/g, "&quot;")}">${a}</button>`).join("");
    $("chips").onclick = e => { const b = e.target.closest(".chip"); if (b) abrir(b.dataset.ag); };
  }
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  IDX.docs.forEach(d => d._s = norm(d.ag + " " + d.l + " " + d.skus.join(" ")));
  function pintarLista() {
    const q = norm($("q").value.trim());
    const ds = IDX.docs.filter(d => !q || d._s.includes(q));
    $("lista").innerHTML = ds.map(d => `<button class="item" role="listitem" data-ag="${d.ag.replace(/"/g, "&quot;")}" aria-current="${d.ag === actual}">
      <span class="nm">${d.ag}</span>${cambi.has(d.ag) ? '<span class="new" title="Cambió en esta versión"></span>' : ""}<span class="meta">${d.n} h</span></button>`).join("")
      || '<div class="note">Ninguna ficha coincide.</div>';
  }
  $("lista").onclick = e => { const b = e.target.closest(".item"); if (b) abrir(b.dataset.ag); };
  $("q").oninput = pintarLista;
  function escala() {
    const disp = document.querySelector("main").clientWidth - 32;
    const z = Math.min(1, disp / 820);
    $("zoomwrap").style.zoom = z;
  }
  window.addEventListener("resize", escala);
  async function abrir(ag) {
    const d = IDX.docs.find(x => x.ag === ag); if (!d) return;
    actual = ag; pintarLista();
    $("tit").textContent = ag; $("meta").textContent = `${d.n} hoja${d.n > 1 ? "s" : ""} · ${d.l}`; $("flag").hidden = !d.sinfoto;
    $("ficha-stage").innerHTML = '<div class="empty">Cargando…</div>';
    try {
      const fs = await (await fetch("d/" + d.f + ".json")).json();
      if (actual !== ag) return;
      $("ficha-stage").innerHTML = fs.map(window._fichaHTML).join("");
      window.FichasDoc.autofit($("ficha-stage"));
    } catch (e) { $("ficha-stage").innerHTML = '<div class="empty">No se pudo cargar esta ficha.</div>'; }
    escala();
    document.querySelector("main").scrollTop = 0;
    try { history.replaceState(null, "", "#" + d.f); } catch (e) {}
  }
  pintarLista(); escala();
  const h = location.hash.slice(1), porHash = IDX.docs.find(d => d.f === h);
  abrir(porHash ? porHash.ag : ([...cambi].find(a => IDX.docs.some(d => d.ag === a)) || (IDX.docs[0] || {}).ag));
})();
</script>
