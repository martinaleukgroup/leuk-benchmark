<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in &amp; Sorteo — Leuk Eventos</title>
<style>html,body{margin:0;padding:0;background:#0d0f14}</style>
<!-- React + XLSX vendorizados (mismo origen, sin CDN). El componente va PRE-COMPILADO en
     eventos.app.js (JSX ya transpilado) → NO se carga Babel en runtime: arranca liviano y
     rápido, incluso con red mala en el evento. Para regenerar eventos.app.js ver su cabecera. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Almacenamiento compartido: reemplaza el storage de artifacts de Claude por la tabla
     `eventos_estado` de Supabase. Todos los usuarios logueados leen/escriben la misma fila
     por clave → estado compartido en vivo. Toma el token de la sesión del usuario (mismo
     origen que la app, así comparte el localStorage). -->
<script>
  (function () {
    var SB_URL = "https://cswqoretlhppxkelysny.supabase.co";
    var SB_KEY = "sb_publishable_Rpbm5uyhUp8aTvoCnHylyA_B0wq8sRs";
    function token() { try { return JSON.parse(localStorage.getItem("benchmark_leuk_sesion")).access_token; } catch (e) { return null; } }
    function head(extra) {
      var h = { apikey: SB_KEY, Authorization: "Bearer " + token(), "Content-Type": "application/json" };
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    }
    window.storage = {
      get: async function (key) {
        try {
          var r = await fetch(SB_URL + "/rest/v1/eventos_estado?select=value&key=eq." + encodeURIComponent(key), { headers: head() });
          if (!r.ok) return null;
          var rows = await r.json();
          return (rows && rows.length) ? { value: rows[0].value } : null;
        } catch (e) { return null; }
      },
      set: async function (key, value) {
        try {
          await fetch(SB_URL + "/rest/v1/eventos_estado", {
            method: "POST",
            headers: head({ Prefer: "resolution=merge-duplicates,return=minimal" }),
            body: JSON.stringify([{ key: key, value: value, ts: new Date().toISOString() }]),
          });
        } catch (e) {}
      }
    };
  })();
</script>

<!-- Componente Check-in & Sorteo, pre-compilado (JSX → JS plano). El poll de sync es de 1s. -->
<script src="eventos.app.js?v=136"></script>
</body>
</html>
