<!-- Almacenamiento compartido: reemplaza el storage de artifacts de Claude por la tabla
     `eventos_estado` de Supabase. Todos los usuarios logueados leen/escriben la misma fila
     por clave → estado compartido en vivo. Toma el token de la sesión del usuario (mismo
     origen que la app, así comparte el localStorage). -->
<script>
  (function () {
    var SB_URL = "https://cswqoretlhppxkelysny.supabase.co";
    var SB_KEY = "sb_publishable_Rpbm5uyhUp8aTvoCnHylyA_B0wq8sRs";
    function token() { try { return JSON.parse(localStorage.getItem("benchmark_leuk_sesion")).access_token; } catch (e) { return null; } }
    function head(extra) {
      var h = { apikey: SB_KEY, Authorization: "Bearer " + token(), "Content-Type": "application/json" };
      if (extra) for (var k in extra) h[k] = extra[k];
      return h;
    }
    window.storage = {
      get: async function (key) {
        try {
          var r = await fetch(SB_URL + "/rest/v1/eventos_estado?select=value&key=eq." + encodeURIComponent(key), { headers: head() });
          if (!r.ok) return null;
          var rows = await r.json();
          return (rows && rows.length) ? { value: rows[0].value } : null;
        } catch (e) { return null; }
      },
      set: async function (key, value) {
        try {
          await fetch(SB_URL + "/rest/v1/eventos_estado", {
            method: "POST",
            headers: head({ Prefer: "resolution=merge-duplicates,return=minimal" }),
            body: JSON.stringify([{ key: key, value: value, ts: new Date().toISOString() }]),
          });
        } catch (e) {}
      }
    };
  })();
</script>

async function loadShared(key, fallback) {
try { const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
catch { return fallback; }
}
async function saveShared(key, value) {
try { await window.storage.set(key, JSON.stringify(value), true); } catch {}
}

const norm = s => String(s ?? "").trim().toLowerCase();
const nameKey = x => { const n = norm(x.nombre), a = norm(x.apellidos); return (n && a) ? n + "|" + a : ""; };
function getInitials(n = "", a = "") { return ((n[0]||"") + (a[0]||"")).toUpperCase(); }

function parseTs(s) {
s = String(s ?? "").trim(); if (!s) return null;
const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
if (m) return new Date(+m[3], +m[2]-1, +m[1]); // formato d/m/aaaa (es-AR)
const d = new Date(s); return isNaN(d) ? null : d;
}

// detección de columnas por palabras clave del encabezado
function detectIdx(headers) {
const idx = cands => { const r = cands.map(x => headers.findIndex(h => h.includes(x))).find(i => i >= 0); return r === undefined ? -1 : r; };
return {
n: idx(["nombre","name","first"]), a: idx(["apellido","last"]),
e: idx(["empresa","estudio","company"]), c: idx(["cargo","puesto","perfil","rol"]),
p: idx(["contacto","propietario","owner","agente"]), m: idx(["mail","email","correo","e-mail"]),
t: idx(["marca temporal","timestamp","fecha","hora"]),
};
}

function splitCsv(text) {
const lines = text.trim().split("\n");
if (lines.length < 2) return { header: [], rows: [] };
const sp = l => l.split(",").map(c => c.replace(/^"|"$/g,"").trim());
return { header: sp(lines[0]), rows: lines.slice(1).map(sp) };
}

function filterSince(headerRow, dataRows, sinceStr) {
if (!sinceStr) return dataRows;
const headers = headerRow.map(h => String(h ?? "").trim().toLowerCase());
const ti = detectIdx(headers).t;
if (ti < 0) return dataRows;
const since = new Date(sinceStr + "T00:00:00");
return dataRows.filter(c => { const d = parseTs(c[ti]); return !d || d >= since; });
}

function rowsToAttendees(headerRow, dataRows, prefix) {
const headers = headerRow.map(h => String(h ?? "").trim().toLowerCase());
const d = detectIdx(headers);
const get = (c, i) => (i >= 0 && c[i] != null) ? String(c[i]).trim() : "";
return dataRows.map((c, i) => ({
id: prefix + i, nombre: get(c,d.n), apellidos: get(c,d.a),
empresa: get(c,d.e), cargo: get(c,d.c), propietario: get(c,d.p), mail: get(c,d.m),
presente: false, formulario: false, manual: false,
})).filter(r => r.nombre || r.empresa);
}

function toSurveyRespondents(headerRow, dataRows) {
const headers = headerRow.map(h => String(h ?? "").trim().toLowerCase());
const d = detectIdx(headers);
const get = (c, i) => (i >= 0 && c[i] != null) ? String(c[i]).trim() : "";
return dataRows.map(c => ({ nombre: get(c,d.n), apellidos: get(c,d.a), mail: get(c,d.m), ts: get(c,d.t) }))
.filter(r => r.mail || r.nombre);
}

// ─── importar ENCUESTA + cruce automático ───────────────────────────────
const applySurvey = (resp, sinceStr) => {
const since = sinceStr ? new Date(sinceStr+"T00:00:00") : null;
const valid = resp.filter(r => { if (!since || !r.ts) return true; const d = parseTs(r.ts); return !d || d >= since; });
const mails = new Set(valid.map(r => norm(r.mail)).filter(Boolean));
const names = new Set(valid.map(nameKey).filter(Boolean));
let matched = 0;
const next = attendees.map(a => {
const hit = (norm(a.mail) && mails.has(norm(a.mail))) || (nameKey(a) && names.has(nameKey(a)));
if (hit) { matched++; return a.formulario ? a : {...a, formulario:true}; }
return a;
});
setAtt(next);
return matched;
};

const resp = toSurveyRespondents(header, rows);
if (!resp.length) throw new Error("No se encontraron respuestas");
const m = applySurvey(resp, surveySince); saveShared(SURVEY_KEY, surveyUrl);
setSurveySt(`✓ ${resp.length} respuestas · ${m} cruzadas con la lista`);
setTimeout(()=>setSurveySt(""),4500);
} catch(e) { setSurveySt("Error: "+e.message); }
};

const start = Date.now();

clearInterval(iv);
const chosen = pool[Math.floor(Math.random()*pool.length)];
setWinner(chosen); setWinners(w=>[...w,chosen]); setRS("winner");
} else { setWinner(pool[Math.floor(Math.random()*pool.length)]); }

</div>
) : (
<button onClick={()=>setConfirmReset("clear")} style={btn(true)}>Limpiar tildados (mantener lista actual)</button>
)}
<div style={{ fontSize:11, color:"#445", marginTop:8 }}>Borra presentes, encuestas y ganadores, pero conserva la lista cargada. Es el reseteo de cada evento.</div>
</div>
<div style={{ height:1, background:"#1e1418", marginBottom:18 }}/>
<div>
{confirmReset==="base" ? (
<div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
<button onClick={resetToBase} style={{ ...btn(false), border:"1px solid #3a1515", color:"#f47", background:"#1a1014" }}>Confirmar: volver a lista base</button>
<button onClick={()=>setConfirmReset(null)} style={btn(false)}>Cancelar</button>
</div>
) : (
<button onClick={()=>setConfirmReset("base")} style={{ ...btn(false), border:"1px solid #2a1c1c" }}>Volver a la lista base</button>
)}
<div style={{ fontSize:11, color:"#334", marginTop:8 }}>Descarta lo importado y restaura los contactos originales del sistema.</div>
</div>
</div>
</div>
)}
</div>

{/* ADD MODAL */}
{showAdd && (
<div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.78)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:20 }}>
<div style={{ background:"#13151c", border:"1px solid #252835", borderRadius:14, padding:28, width:"100%", maxWidth:420, animation:"fadeUp .2s" }}>
<div style={{ fontFamily:"'Syne',sans-serif", fontSize:16, fontWeight:700, marginBottom:20, color:"#fff" }}>Agregar walk-in</div>
{[["nombre","Nombre *"],["apellidos","Apellido"],["mail","Mail"],["empresa","Empresa"],["cargo","Perfil / cargo"]].map(([k,l])=>(
<div key={k} style={{ marginBottom:11 }}>
<label style={{ fontSize:10, color:"#445", fontFamily:"'DM Mono',monospace", display:"block", marginBottom:4 }}>{l}</label>
<input value={newP[k]} onChange={e=>setNewP(p=>({...p,[k]:e.target.value}))} style={inp}/>
</div>
))}
<div onClick={()=>setNewP(p=>({...p,formulario:!p.formulario}))} style={{ display:"flex", alignItems:"center", gap:10, marginTop:6, padding:"10px 12px",
background:"#0d0f14", border:`1px solid ${newP.formulario?"#2f9e6e40":"#1e2130"}`, borderRadius:8, cursor:"pointer" }}>
<span style={stateBtn(newP.formulario,"linear-gradient(135deg,#2f9e6e,#1c6b48)","#2f9e6e40")}>{newP.formulario?"✓":"F"}</span>
<div>
<div style={{ fontSize:13, color:"#ccc", fontWeight:500 }}>Ya completó la encuesta</div>
<div style={{ fontSize:11, color:"#445" }}>Necesario para entrar al sorteo</div>
</div>
</div>
<div style={{ display:"flex", gap:8, marginTop:18 }}>
<button onClick={addManual} style={{ ...btn(true), flex:1, textAlign:"center" }}>Agregar como presente</button>
<button onClick={()=>setShowAdd(false)} style={{ ...btn(false), flex:1, textAlign:"center" }}>Cancelar</button>
</div>
</div>
</div>
)}
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
