<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leuk Marketing</title>
<link rel="icon" href="assets/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=1">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- íconos del menú (sólo los que se usan; la lista va en orden alfabético) -->

<link rel="stylesheet" href="acciones.css?v=5">
</head>
<body class="locked">

<!-- PANTALLA DE INGRESO (cubre toda la app hasta iniciar sesión) -->
<div id="gate" class="gate">
  <div class="gate-card">
    <img src="assets/logo-leuk-ilum.png?v=240" alt="Leuk Iluminación" class="gate-logo">
    <h1>Leuk Marketing</h1>
    <p class="gate-sub">Ingresá con tu usuario para acceder.</p>
    <input id="gateEmail" type="email" placeholder="Email" autocomplete="username" class="lg-in">
    <input id="gatePass" type="password" placeholder="Contraseña" autocomplete="current-password" class="lg-in">
    <div id="gateErr" class="lg-err"></div>
    <button id="gateGo" class="btn-primary gate-btn">Ingresar</button>
    <button id="gateForgot" class="lg-link">¿Olvidaste tu contraseña?</button>
  </div>
</div>

<!-- Estructura: menú lateral (grupos → páginas, lo arma renderNav en app.js) + contenido. -->
<div class="shell">
<aside id="side" class="side" aria-label="Menú principal">
  <div class="side-brand">
    <img src="assets/isologo-uk.png?v=240" alt="Ukelele" class="logo">
    <span class="side-name">Leuk Marketing</span>
    <button id="navClose" class="side-close" aria-label="Cerrar menú"><span class="ms">close</span></button>
  </div>
  <nav id="nav" class="side-nav"></nav>
  <div class="side-foot">
    <button id="btnAuth" class="side-user" title="Tu cuenta">👤</button>
  </div>
</aside>
<div id="sideScrim" class="side-scrim"></div>

<div class="content">
<div class="topwrap">
<!-- barra superior: sólo en celular/tablet (hamburguesa + dónde estás) -->
<header class="topbar">
  <button id="navOpen" class="tb-menu" aria-label="Abrir menú"><span class="ms">menu</span></button>
  <img src="assets/isologo-uk.png?v=240" alt="" class="logo">
  <span id="tbTitle" class="tb-title">Mi día</span>
</header>
<!-- barra de la página: título + herramientas propias (hoy sólo Benchmark: Descuentos) -->
<div id="subbar" class="pagebar hidden">
  <span class="pb-grp" id="sbLabel"></span>
  <h2 class="pb-title" id="sbTitle"></h2>
  <div class="sb-tools" id="sbTools">
    <button id="btnDesc" class="btn-desc" title="Editar descuentos / precio neto">⚙ Descuentos</button>
  </div>
</div>
</div>


<main>
  <!-- PÁGINA INICIO (home) -->
  <section id="page-inicio" class="page"><div id="inicio"></div></section>

  <!-- PÁGINA COMPARACIONES -->
  <section id="page-comparaciones" class="page hidden">
    <div class="search-wrap">
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="Buscá un producto Leuk por SKU, nombre o familia…">
    </div>
    <div id="catFilters" class="cat-filters"></div>
    <div id="catCount" class="cat-count"></div>
    <div id="catalogo" class="cat-grid"></div>
    <div id="comparacion"></div>
  </section>

  <!-- PÁGINA RESULTADOS (solo comparaciones autorizadas) -->
  <section id="page-resultados" class="page hidden">
    <div class="res-intro">Comparaciones <b>seleccionadas</b> — comparación por <b>precio neto</b> (con el descuento de cada marca). Seleccioná desde <b>Catálogo</b>.</div>
    <div class="filters" id="filters"></div>
    <div class="filters-bar">
      <span id="countLabel" class="count"></span>
      <div class="btn-row">
        <button id="importBtn" class="btn-ghost">⬆ Importar</button>
        <button id="exportJsonBtn" class="btn-ghost">⬇ Selecciones (.json)</button>
        <button id="exportBtn" class="btn-ghost">⬇ Exportar Excel</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>
    <div id="tabla"></div>
  </section>

  <!-- PÁGINA DECISIONES (tablero sobre lo autorizado) -->
  <section id="page-decisiones" class="page hidden">
    <div class="res-intro">Insights sobre tus comparaciones <b>seleccionadas</b>. Cuantas más selecciones, más completo.</div>
    <div id="dash"></div>
  </section>

  <!-- PÁGINA NUEVAS INTEGRACIONES (revisar/aprobar lo importado de competidores) -->
  <section id="page-integraciones" class="page hidden"></section>

  <!-- PÁGINA MANUAL DE CARGA (la receta de cada competidor: dónde vive cada dato) -->
  <section id="page-manual" class="page hidden"></section>

  <!-- PÁGINA FICHAS TÉCNICAS (estado de cada ficha + la ficha dibujada) -->
  <section id="page-fichas" class="page hidden"></section>

  <!-- PÁGINA FIRMAS DE MAIL (app autocontenida embebida) -->
  <section id="page-firmas" class="page hidden">
    <iframe id="firmasFrame" class="embed-frame" title="Generador de firmas de mail"></iframe>
  </section>

  <!-- PÁGINA STOCK DIARIO (app autocontenida embebida) -->
  <section id="page-stock" class="page hidden">
    <iframe id="stockFrame" class="embed-frame" title="Generador de stock diario"></iframe>
  </section>

  <!-- PÁGINA REINGRESOS (app autocontenida embebida) -->
  <section id="page-reingresos" class="page hidden">
    <iframe id="reingresosFrame" class="embed-frame" title="Generador de reingresos"></iframe>
  </section>

  <!-- PÁGINA EVENTOS (app React autocontenida embebida: check-in + sorteo) -->
  <section id="page-eventos" class="page hidden">
    <iframe id="eventosFrame" class="embed-frame" title="Check-in y sorteo de eventos"></iframe>
  </section>

  <!-- PÁGINAS CONTENIDOS — un cronograma por canal (calendario + fichas + comentarios).
       Los dos los dibuja contenidos.js; cada canal tiene su propio contenedor. -->
  <section id="page-contenidos" class="page hidden"><div id="contenidos"></div></section>
  <section id="page-contenidos-ig" class="page hidden"><div id="contenidos-ig"></div></section>

  <!-- PÁGINA TAREAS — sólo el equipo de marketing (tablero + lista + calendario, lo dibuja tareas.js) -->
  <section id="page-tareas" class="page hidden"><div id="tareas"></div></section>

  <!-- PÁGINA ACCIONES — sólo Admin y Líder (lista + ficha con línea de tiempo y métricas, lo dibuja acciones.js) -->
  <section id="page-acciones" class="page hidden"><div id="acciones"></div></section>

  <!-- PÁGINA USUARIOS (sólo admin) -->
  <section id="page-usuarios" class="page hidden"><div id="usuarios"></div></section>
</main>

<!-- NOTIFICACIONES: pop-ups dentro de la app, apilados arriba del botón de Ayuda (los arma app.js) -->
<div id="notis" class="notis" aria-live="polite"></div>

<!-- AYUDA: botón flotante abajo a la derecha + pop-up con cómo se usa cada sección
     (lo arma abrirAyuda en app.js). Va por debajo de los paneles de Tareas/fichas (z 39). -->
<button id="ayudaFab" class="ay-fab js-ayuda" title="Ayuda: cómo se usa cada sección" aria-label="Ayuda" aria-expanded="false" aria-controls="ayuda">?</button>
<div id="ayudaVelo" class="ay-velo"></div>
<aside id="ayuda" class="ay-panel" role="dialog" aria-labelledby="ayudaTit">
  <div class="ay-head">
    <h2 id="ayudaTit">Ayuda</h2>
    <button id="ayudaCerrar" class="side-close" aria-label="Cerrar ayuda"><span class="ms">close</span></button>
  </div>
  <div id="ayudaBody" class="ay-body"></div>
</aside>

<div id="detail" class="detail hidden"><div class="detail-inner" id="detailInner"></div></div>
<footer class="foot"><span id="metaLine"></span></footer>
</div><!-- /content -->
</div><!-- /shell -->

<!-- Mantiene --appbar-h igual al alto real de la barra (topbar + sub-barra),
     para que las mini-apps embebidas llenen exacto el alto de pantalla. -->
<script>
(function(){
  var tw = document.querySelector('.topwrap');
  if(!tw) return;
  function sync(){
    document.documentElement.style.setProperty('--appbar-h', Math.round(tw.getBoundingClientRect().height) + 'px');
  }
  sync();
  if(window.ResizeObserver){ new ResizeObserver(sync).observe(tw); }
  window.addEventListener('resize', sync);
})();
</script>
</body>
</html>
