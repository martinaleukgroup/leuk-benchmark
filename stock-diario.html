    }

    // Contar productos visibles
    let totalMostrados = 0;

    // Set para evitar duplicados: cada SKU aparece solo en su PRIMERA sección
    const skusYaMostrados = new Set();

    // SECCIONES dinámicas si hay archivo de familias, fallback al estático si no
    const seccionesActivas = construirSeccionesDinamicas();

    // Iterar secciones
    seccionesActivas.forEach(sec => {
      // Filtrar: existe en stock + tiene stock + no fue mostrado en sección previa
      let skusVisibles = sec.skus.filter(sku => {
        if (skusYaMostrados.has(sku)) return false;     // dedupe
        const p = STOCK_MAP[sku];
        if (!p) return false;
        if (p.disp === 'SIN STOCK') return false;
        return true;
      });
      if (skusVisibles.length === 0) return;

      // Marcar como mostrados
      skusVisibles.forEach(sku => skusYaMostrados.add(sku));

      const nuevosSet = new Set(sec.nuevos);
      const descontinuadosSet = new Set(sec.descontinuados || []);
      // Un SKU discontinuado nunca se trata como "nuevo" ni como "resto":
      // va siempre al bloque final con el cartel "ÚLTIMAS UNIDADES".
      const nuevosVisibles        = skusVisibles.filter(s => nuevosSet.has(s) && !descontinuadosSet.has(s));
      const descontinuadosVisibles = skusVisibles.filter(s => descontinuadosSet.has(s));
      const restoVisibles          = skusVisibles.filter(s => !nuevosSet.has(s) && !descontinuadosSet.has(s));

      // Caso borde: la familia entera está discontinuada (no queda ningún
      // producto activo). Ahí la banda de cierre quedaría inmediatamente
      // debajo del título de la familia, dando dos franjas grises pegadas
      // sin nada en el medio. En ese caso se fusionan en una sola banda:
      //   EXTERIOR | ESTACAS | ESTACA | DISPONIBLE HASTA AGOTAR STOCK
      const soloDescontinuados =
        descontinuadosVisibles.length > 0 &&
        (nuevosVisibles.length + restoVisibles.length) === 0;

      totalMostrados += skusVisibles.length;

      // Contenedor de sección
      const secEl = document.createElement('section');
      secEl.className = 'seccion';

      // Header de la sección
      const header = document.createElement('div');
      header.className = 'sec-header';
      // El texto de cierre se suma como un tramo más del título, con el
      // mismo separador. Va en .sec-part-bold, que es exactamente el mismo
      // estilo que usa .sub-header-txt en la banda separada, así que el
      // cartel se lee igual esté fusionado o no. Además .sec-part-bold ya
      // está en INVISIBLE_TEXT_SELECTORS: el texto sigue siendo buscable
      // en el PDF sin tocar nada más.
      header.innerHTML = secPathHTML(sec.path) + (soloDescontinuados
        ? '<span class="sec-part-sep"> | </span>' +
          '<span class="sec-part-bold">Disponible hasta agotar stock</span>'
        : '');
      secEl.appendChild(header);

      // Grilla de productos ACTIVOS.
      // Orden: 1) NUEVOS (badge verde) · 2) resto de activos.
      // Los discontinuados ya no van acá: desde v30 tienen su propio
      // bloque al cierre de la familia (ver más abajo).
      const grid = document.createElement('div');
      const claseGrid = 'product-grid' + (sec.id === 'ventiladores' ? ' grid-venti' : '');
      grid.className = claseGrid;

      nuevosVisibles.forEach(sku => {
        grid.appendChild(renderCard(sku, true, hayFotos));            // es nuevo → badge verde
      });
      restoVisibles.forEach(sku => {
        grid.appendChild(renderCard(sku, false, hayFotos));           // producto normal
      });

      // La grilla de activos sólo se agrega si tiene algo. Puede quedar
      // vacía si TODOS los productos de la familia están discontinuados:
      // en ese caso la sección muestra su título y directamente la banda
      // de "disponible hasta agotar stock".
      if (grid.children.length > 0) secEl.appendChild(grid);

      // CIERRE DE FAMILIA: productos discontinuados bajo su propia banda.
      // El título explica el estado del grupo entero, así que las tarjetas
      // no llevan cartel individual.
      // Si soloDescontinuados, el aviso ya se fusionó arriba en el título
      // de la familia y acá sólo va la grilla.
      if (descontinuadosVisibles.length > 0) {
        if (!soloDescontinuados) {
          const subHeader = document.createElement('div');
          subHeader.className = 'sub-header';
          subHeader.innerHTML = '<span class="sub-header-txt">Disponible hasta agotar stock</span>';
          secEl.appendChild(subHeader);
        }

        const gridDesc = document.createElement('div');
        gridDesc.className = claseGrid;
        descontinuadosVisibles.forEach(sku => {
          gridDesc.appendChild(renderCard(sku, false, hayFotos, true));
        });
        secEl.appendChild(gridDesc);
      }

      area.appendChild(secEl);
    });

    console.log(`[RENDER] ${totalMostrados} productos mostrados en el PDF`);

    // Actualizar stats
    document.getElementById('st-prods').textContent = totalMostrados;
    document.getElementById('st-secs').textContent  = seccionesActivas.length;
    document.getElementById('st-fecha').textContent = fechaLargaElegida();

    // Edición: enganchar click handlers + zonas de "+ insertar corte"
    attachCardClickHandler();
    attachInsertBreakZones();
    markFotosLoadedClass();
    activarLinksNota();
    // Si ya había una foto en el portapapeles antes del render (p.ej. cargaste
    // un Excel mientras tenías una foto copiada), sincronizar los botones nuevos.
    updatePasteButtons();
  } catch(err) {
    console.error('[RENDER] Error:', err);
    const area = document.getElementById('pdf-area');
    area.innerHTML = `<div style="padding: 80px 40px; text-align: center; color: #c00;">
      <p style="font-size: 1.2rem; margin-bottom: 12px;">⚠️ Error al renderizar</p>
      <p style="font-size: 0.85rem;">${err.message}</p>
      <p style="margin-top: 16px; font-size: 0.7rem; color: #888;">Mirá la consola del navegador (F12) para más detalles.</p>
    </div>`;
  }
}

function renderCard(sku, esNuevo, hayFotos, esDescontinuado) {
  const p = STOCK_MAP[sku];
  const card = document.createElement('div');
  card.className = 'product-card';
  card.dataset.sku = sku;
  card.dataset.cardId = `card-${sku}-${Math.random().toString(36).slice(2,7)}`;

  // El nombre se toma del Excel de Familias si está cargado (es más limpio,
  // sin specs técnicas). Si no está, usamos el del Excel de Stock como fallback.
  const orgInfo  = FAMILIAS_MAP[sku];
  let nombre    = (orgInfo && orgInfo.nombre) ? String(orgInfo.nombre).trim() : p.nombre;

  // Caso especial: ventiladores LAFTDREN — el prefijo "VENTILADOR DE TECHO LAFTDREN"
  // ya está implícito en el título de la sección, así que lo quitamos del nombre.
  // Ej: "VENTILADOR DE TECHO LAFTDREN 441 A" → "441 A"
  nombre = nombre.replace(/^VENTILADOR\s+DE\s+TECHO\s+LAFTDREN\s+/i, '').trim();
  // Con el Maestro de Ventiladores, el nombre sale de ahí ya sin «LAFTDREN».
  if (typeof VENT_MAP !== 'undefined' && VENT_MAP[sku] && VENT_MAP[sku].nombre) {
    nombre = VENT_MAP[sku].nombre;
  }

  const nombreCorto = abreviar(nombre);

  // Nota técnica opcional (ver NOTAS_SKU). Se inyecta DENTRO de .prod-name
  // como bloque, así cae siempre en su propia línea justo debajo del nombre,
  // sin importar si el nombre ocupó una o dos líneas.
  const notaSku   = NOTAS_SKU[String(sku)] || '';
  const linkCfg   = LINKS_NOTA[String(sku)] || null;
  let   notaHTML  = '';
  if (notaSku) {
    notaHTML = linkCfg
      // Candidata a link. activarLinksNota() confirma después del render si
      // la otra versión existe; si no, elimina la nota entera.
      ? `<span class="prod-nota prod-nota-link" data-destinos="${linkCfg.destinos.join(',')}"` +
        ` data-modo="${linkCfg.modo}"` +
        ` title="Ver la otra versión de este producto">${notaSku}${ICONO_CURSOR}</span>`
      : `<span class="prod-nota">${notaSku}</span>`;
  }

  let photoHTML = '';
  if (hayFotos && PHOTO_MAP[sku]) {
    // Foto extraída del zip
    photoHTML = `<img src="${PHOTO_MAP[sku]}" alt="${nombreCorto}" crossorigin="anonymous">`;
  } else if (hayFotos) {
    // No hay foto para este SKU → placeholder con "sin foto"
    photoHTML = `<div class="photo-placeholder" title="Falta foto del SKU ${sku}">◌</div>`;
  } else {
    // Sin fotos cargadas
    photoHTML = `<div class="photo-placeholder">◌</div>`;
  }

  // Pila de badges en la esquina superior derecha de la foto:
  // "Nuevo" arriba y el de disponibilidad debajo (ver .badge-stack).
  // Ya NO se emite el badge individual "Stock Final": desde v30 los
  // discontinuados van agrupados bajo la banda "DISPONIBLE HASTA AGOTAR
  // STOCK" al final de su familia, que cumple la misma función.
  const badges = [];
  if (esNuevo && !esDescontinuado) badges.push('<span class="badge-nuevo">Nuevo</span>');

  const estadoDisp = estadoDisponibilidad(sku);
  if (estadoDisp) {
    badges.push(`<span class="badge-disp ${estadoDisp.clase}">${estadoDisp.etiqueta}</span>`);
  }

  const estadoBadge = badges.length
    ? `<div class="badge-stack">${badges.join('')}</div>`
    : '';

  // Toolbar flotante (oculto hasta que se selecciona la tarjeta).
  // Acciones SOLO sobre la foto: la tarjeta (nombre + SKU) viene del Excel
  // y no se toca.
  const toolbarHTML = `
    <div class="foto-toolbar" onclick="event.stopPropagation()">
      <button type="button" title="Achicar foto (mantiene proporciones)" onclick="resizePhoto(this, -1)">➖</button>
      <button type="button" title="Agrandar foto (mantiene proporciones)" onclick="resizePhoto(this, +1)">➕</button>
      <button type="button" title="Copiar esta foto al portapapeles" onclick="copyPhoto(this)">📋 Copiar</button>
      <button type="button" class="btn-paste" title="Pegar la foto copiada en este recuadro" onclick="pastePhoto(this)" disabled>📥 Pegar</button>
      <button type="button" class="danger" title="Quitar la foto (queda placeholder)" onclick="deletePhoto(this)">🗑️ Borrar</button>
    </div>`;

  card.innerHTML = `
    ${toolbarHTML}
    ${estadoBadge}
    <div class="photo-box"><div class="photo-inner">${photoHTML}</div></div>
    <div class="prod-name" title="${nombre}${notaSku ? ' ' + notaSku : ''}">${nombreCorto}${notaHTML}</div>
    <div class="prod-sku">SKU ${sku}</div>
  `;
  return card;
}

/* ----------------------------------------------------------------
   NOTAS INTERACTIVAS — RESOLUCIÓN DE DESTINO
   ----------------------------------------------------------------
   Un "bloque" es un hijo directo de #pdf-area (portada o sección). Es la
   unidad que el exportador pega en el PDF, así que todo destino termina
   expresándose como bloque + desplazamiento dentro del bloque.
   ---------------------------------------------------------------- */

// Primera tarjeta de la lista que aparezca EN ORDEN DE DOCUMENTO.
// Ojo: no es el orden de la lista de SKUs. Dentro de una sección las
// tarjetas se reordenan (nuevos primero, discontinuados al final), así
// que el "primero que aparece en el PDF" hay que preguntárselo al DOM.
// querySelector con selectores separados por coma devuelve exactamente eso.
function primeraTarjetaDeSkus(skus) {
  const area = document.getElementById('pdf-area');
  if (!area || !skus || !skus.length) return null;
  const sel = skus.map(s => `.product-card[data-sku="${s}"]`).join(',');
  return area.querySelector(sel);
}

// Sube desde cualquier nodo hasta el hijo directo de #pdf-area.
function bloqueDe(el) {
  const area = document.getElementById('pdf-area');
  if (!area || !el) return null;
  let b = el;
  while (b.parentElement && b.parentElement !== area) b = b.parentElement;
  return (b.parentElement === area) ? b : null;
}

// Resuelve el destino de una nota a partir de sus data-attributes.
// Devuelve { ancla, bloque } o null si la otra versión no está publicada.
//   modo 'producto' → el ancla es la tarjeta (aterriza sobre el producto)
//   modo 'seccion'  → el ancla es el bloque  (aterriza en el título)
function destinoDeNota(destinos, modo) {
  const card = primeraTarjetaDeSkus(destinos);
  if (!card) return null;
  const bloque = bloqueDe(card);
  if (!bloque) return null;
  return { ancla: (modo === 'producto' ? card : bloque), bloque };
}

function destinoDeElemento(el) {
  const destinos = (el.dataset.destinos || '').split(',').filter(Boolean);
  return destinoDeNota(destinos, el.dataset.modo);
}

// Después de cada render: la nota sobrevive SÓLO si la otra versión existe
// en el archivo del día. Si no, se elimina completa (texto + ícono), para
// no publicar una bajada que promete algo que no está ni un botón que no
// lleva a ningún lado. Como la regla es recíproca y ambos grupos se
// apuntan entre sí, alcanza con que una punta quede vacía para que las
// notas desaparezcan de los dos lados.
function activarLinksNota() {
  const area = document.getElementById('pdf-area');
  if (!area) return;
  let vivas = 0, quitadas = 0;
  area.querySelectorAll('.prod-nota-link').forEach(el => {
    if (destinoDeElemento(el)) { vivas++; return; }
    el.remove();
    quitadas++;
  });
  console.log(`[NOTAS] interactivas: ${vivas} · quitadas por falta de la otra versión: ${quitadas}`);
}

// Click en la nota dentro del preview: scrollear al destino y resaltar un
// instante las tarjetas de la otra versión.
function irADestinoNota(el) {
  const destino = destinoDeElemento(el);
  if (!destino) return;
  const esProducto = el.dataset.modo === 'producto';
  destino.ancla.scrollIntoView({
    behavior: 'smooth',
    // Sobre un producto puntual conviene centrarlo; sobre una sección
    // entera, arrancar desde el título.
    block: esProducto ? 'center' : 'start'
  });
  const skus = (el.dataset.destinos || '').split(',').filter(Boolean);
  skus.forEach(sku => {
    const c = document.querySelector(`#pdf-area .product-card[data-sku="${sku}"]`);
    if (!c) return;
    c.classList.remove('nota-flash');
    void c.offsetWidth;              // forzar reinicio de la animación
    c.classList.add('nota-flash');
    setTimeout(() => c.classList.remove('nota-flash'), 1700);
  });
}

/* ----------------------------------------------------------------
   PERSONALIZACIÓN: LOGO + TIPOGRAFÍAS
   Guardamos logo como base64 y fuentes como base64 en localStorage
   para que no haya que re-subirlos cada vez.
   ---------------------------------------------------------------- */
const CUSTOM = {
  logoUrl: null,      // objectURL del logo cargado
  fonts: {            // nombres de familia custom activas
    titulo: null,
    nombre: null,
    sku:    null,
  }
};

const LS_KEY_LOGO  = 'leuk_custom_logo';
const LS_KEY_FONTS = 'leuk_custom_fonts';

// Convierte un File a base64 string (sin prefijo data:)
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result);   // r.result ya viene como data URL
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function toggleCustom() {
  const panel = document.getElementById('panel-custom');
  const btn   = document.getElementById('btn-custom');
  panel.classList.toggle('on');
  btn.classList.toggle('activo');
}

/* ----- LOGO ----- */
async function loadLogo(file) {
  if (!file) return;
  try {
    const dataUrl = await fileToBase64(file);
    applyLogo(dataUrl, file.name);
    localStorage.setItem(LS_KEY_LOGO, JSON.stringify({ dataUrl, name: file.name }));
  } catch(err) {
    alert('Error cargando el logo: ' + err.message);
  }
}

function applyLogo(dataUrl, filename) {
  CUSTOM.logoUrl = dataUrl;
  const preview = document.getElementById('preview-logo');
  preview.src = dataUrl;
  preview.style.display = 'block';
  document.getElementById('up-logo').classList.add('loaded');
  document.getElementById('up-logo-txt').textContent = '✓ ' + (filename || 'logo cargado');
  render();
}

/* ----- FUENTES ----- */
async function loadFont(file, tipo) {
  if (!file) return;
  if (!['titulo','nombre','sku'].includes(tipo)) return;

  try {
    const dataUrl  = await fileToBase64(file);
    await applyFont(dataUrl, file.name, tipo);

    // Persistir
    const saved = JSON.parse(localStorage.getItem(LS_KEY_FONTS) || '{}');
    saved[tipo] = { dataUrl, name: file.name };
    localStorage.setItem(LS_KEY_FONTS, JSON.stringify(saved));
  } catch(err) {
    alert(`Error cargando la fuente (${tipo}): ${err.message}`);
  }
}

async function applyFont(dataUrl, filename, tipo) {
  // Convertir data URL → ArrayBuffer para FontFace
  const resp = await fetch(dataUrl);
  const buf  = await resp.arrayBuffer();

  const familyName = `leuk-custom-${tipo}`;
  const face = new FontFace(familyName, buf);
  await face.load();
  document.fonts.add(face);

  CUSTOM.fonts[tipo] = familyName;

  // Aplicar al CSS var
  document.documentElement.style.setProperty(
    `--font-${tipo}`,
    `"${familyName}", sans-serif`
  );

  // Update UI
  document.getElementById(`up-font-${tipo}`).classList.add('loaded');
  document.getElementById(`up-font-${tipo}-txt`).textContent = '✓ ' + (filename || 'fuente cargada');

  // El preview del panel de control se refresca solo por CSS var,
  // pero forzamos render para que actualicen las tarjetas del PDF
  render();
}

/* ----- RESET ----- */
async function resetCustom() {
  if (!(await (window.lkConfirmar ? lkConfirmar('¿Quitar logo y tipografías personalizadas y volver a los valores por defecto?', { ok: 'Restablecer' }) : confirm('¿Quitar logo y tipografías personalizadas y volver a los valores por defecto?')))) return;

  localStorage.removeItem(LS_KEY_LOGO);
  localStorage.removeItem(LS_KEY_FONTS);

  CUSTOM.logoUrl = null;
  CUSTOM.fonts = { titulo:null, nombre:null, sku:null };

  // Limpiar CSS vars (vuelven a los defaults Barlow)
  document.documentElement.style.removeProperty('--font-titulo');
  document.documentElement.style.removeProperty('--font-nombre');
  document.documentElement.style.removeProperty('--font-sku');

  // Limpiar UI
  const preview = document.getElementById('preview-logo');
  preview.style.display = 'none';
  preview.src = '';

  ['logo','font-titulo','font-nombre','font-sku'].forEach(id => {
    const el  = document.getElementById('up-' + id);
    const txt = document.getElementById('up-' + id + '-txt');
    if (el)  el.classList.remove('loaded');
    if (txt) txt.textContent = id === 'logo'
      ? 'Elegir PNG / JPG / SVG…'
      : 'Elegir TTF / OTF / WOFF…';
  });

  render();
}

/* ----- RESTAURAR DESDE LOCALSTORAGE AL INICIAR ----- */
async function restoreCustom() {
  // Logo
  try {
    const raw = localStorage.getItem(LS_KEY_LOGO);
    if (raw) {
      const { dataUrl, name } = JSON.parse(raw);
      applyLogo(dataUrl, name);
    }
  } catch {}

  // Fuentes
  try {
    const raw = localStorage.getItem(LS_KEY_FONTS);
    if (raw) {
      const saved = JSON.parse(raw);
      for (const tipo of ['titulo','nombre','sku']) {
        if (saved[tipo]) {
          try {
            await applyFont(saved[tipo].dataUrl, saved[tipo].name, tipo);
          } catch(err) {
            console.warn(`No se pudo restaurar la fuente ${tipo}:`, err);
          }
        }
      }
    }
  } catch {}
}

/* ----------------------------------------------------------------
   CARGAR EXCEL DE ORGANIZACIÓN DE FAMILIAS
   Estructura esperada: SKU | Nombre | Subfamilia | Familia | Vertical | Colección | Estado
   El "Estado" determina si el producto es Nuevo / Activo / Discontinuo
   La sección del PDF se construye como: Vertical > Familia > Subfamilia
   ---------------------------------------------------------------- */
function updateFamiliasPill() {
  const count = Object.keys(FAMILIAS_MAP).length;
  const pill = document.getElementById('familias-pill');
  if (count > 0) {
    pill.classList.add('activo');

  } else {

function loadFamilias(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      console.log('[FAMILIAS] Iniciando lectura:', file.name);
      const wb = XLSX.read(e.target.result, { type: 'array' });
      console.log('[FAMILIAS] Hojas:', wb.SheetNames);

      const ws = wb.Sheets['Luminaría'] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

      // Detectar fila de header
      let headerRow = -1;
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const row = rows[i] || [];
        const txt = row.map(c => String(c||'').toLowerCase()).join(' ');
        if (txt.includes('sku') && txt.includes('nombre') && txt.includes('subfamilia')) {
          headerRow = i; break;
        }
      }
      if (headerRow < 0) {
        alert('⚠️ No se reconoce la estructura del archivo de familias.\nEl archivo debe tener columnas: SKU, Nombre, Subfamilia, Familia, Vertical, Colección, Estado');
        return;
      }

      const headers = rows[headerRow].map(h => String(h||'').toLowerCase().trim());
      const idxSKU       = headers.findIndex(h => h === 'sku');
      const idxNombre    = headers.findIndex(h => h === 'nombre');
      const idxSubfam    = headers.findIndex(h => h.includes('subfamilia'));
      const idxFamilia   = headers.findIndex(h => h === 'familia');
      const idxVertical  = headers.findIndex(h => h === 'vertical');
      const idxColeccion = headers.findIndex(h => h.includes('colecc'));
      const idxEstado    = headers.findIndex(h => h === 'estado');

      console.log('[FAMILIAS] Columnas:', { idxSKU, idxNombre, idxSubfam, idxFamilia, idxVertical, idxColeccion, idxEstado });

      const nuevoMap = {};
      let conteoEstados = {};

      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const skuRaw = row[idxSKU];
        const skuVal = typeof skuRaw === 'number' ? skuRaw : parseFloat(String(skuRaw || '').trim());
        if (!skuVal || isNaN(skuVal)) continue;

        const estado = String(row[idxEstado] || '').trim();
        nuevoMap[Math.round(skuVal)] = {
          nombre:    row[idxNombre] || '',
          subfam:    row[idxSubfam] || '',
          fam:       row[idxFamilia] || '',
          vert:      row[idxVertical] || '',
          coleccion: row[idxColeccion] || '',
          estado:    estado,
        };
        conteoEstados[estado] = (conteoEstados[estado] || 0) + 1;
      }

      console.log(`[FAMILIAS] Total parseados: ${Object.keys(nuevoMap).length}`);
      console.log('[FAMILIAS] Estados:', conteoEstados);

      if (Object.keys(nuevoMap).length === 0) {
        alert('⚠️ No se encontraron SKUs en el archivo. Verificá que tenga la estructura correcta.');
        return;
      }

      // Reemplazar
      Object.keys(FAMILIAS_MAP).forEach(k => delete FAMILIAS_MAP[k]);
      Object.assign(FAMILIAS_MAP, nuevoMap);

      // Persistir en localStorage (puede pesar bastante, usamos try/catch)
      try {
        localStorage.setItem(LS_KEY_FAMILIAS, JSON.stringify(nuevoMap));
      } catch(err) {
        console.warn('[FAMILIAS] No se pudo persistir en localStorage:', err);
      }

      updateFamiliasPill();

      // Cuántos SKUs del stock están mapeados
      const skusStock = new Set(Object.keys(STOCK_MAP).map(Number));
      const skusOrg   = new Set(Object.keys(nuevoMap).map(Number));
      const enAmbos   = [...skusStock].filter(s => skusOrg.has(s));
      const sinMapeo  = [...skusStock].filter(s => !skusOrg.has(s));

      let msg = `✓ Familias cargadas correctamente.\n\n`;
      msg += `Total SKUs en archivo: ${skusOrg.size}\n`;
      msg += `SKUs del stock con mapeo: ${enAmbos.length}\n`;
      msg += `SKUs del stock SIN mapeo: ${sinMapeo.length}\n\n`;
      msg += `Estados:\n`;
      for (const [e, n] of Object.entries(conteoEstados)) msg += `  • ${e}: ${n}\n`;
      if (sinMapeo.length > 0 && sinMapeo.length <= 30) {
        msg += `\nSKUs sin mapeo:\n`;
        sinMapeo.slice(0, 10).forEach(s => msg += `  • ${s}\n`);
        if (sinMapeo.length > 10) msg += `  ... y ${sinMapeo.length - 10} más (estos van a "Sin clasificar")\n`;
      }
      alert(msg);

      render();
    } catch(err) {
      console.error('[FAMILIAS] Error:', err);
      alert('Error leyendo el Excel de familias: ' + err.message);
    }
  };
  r.readAsArrayBuffer(file);
}

function restoreFamilias() {

    if (!raw) return;
    const data = JSON.parse(raw);

  }
}


/* ----------------------------------------------------------------
   LEER EXCEL DE STOCK — versión ULTRA permisiva
   Detecta columnas SKU / Nombre / Disponibilidad de 3 formas:
     1. Por header: busca "SKU" y "DISPONIBILIDAD" en las primeras 10 filas
     2. Por contenido: busca columnas con valores ALTO/MEDIO/BAJO/SIN STOCK
     3. Si todo falla, vuelca un dump de las primeras 10 filas para diagnóstico
   ---------------------------------------------------------------- */
/* El análisis del libro de stock, separado de la lectura del archivo: lo
   usan tanto el botón manual como la lectura en vivo desde Google Sheets.
   Devuelve cuántos productos encontró (0 = no tocó nada). */
function procesarLibroStock(wb, silencioso) {
    const nuevoMap = {};
    let totalFilasEscaneadas = 0;
    const dumpHojas = [];   // para diagnóstico si falla todo

    // 'MUY BAJO STOCK' es como el Excel rotula hoy a 'ULTIMAS UNIDADES'
    // (ver ALIAS_DISP). Tiene que estar acá o esos productos ni siquiera
    // pasan el filtro de fila y desaparecen del PDF.
    const VALORES_DISP = ['ALTO','MEDIO','BAJO','ULTIMAS UNIDADES','SIN STOCK','ÚLTIMAS UNIDADES','ULTIMAS','ÚLTIMAS','MUY BAJO STOCK','SIN','S/STOCK'];

    const esValorDisp = v => {
      if (!v) return false;
      const s = String(v).trim().toUpperCase();
      return VALORES_DISP.some(d => s === d || s.startsWith(d));
    };

    // Igual que VALORES_DISP pero para comparación EXACTA: sirve para
    // decidir si una celda ES un rótulo de disponibilidad y no un nombre
    // de producto que casualmente empieza igual (SINTRA, ULTRA…).
    const DISP_EXACTOS = new Set(['ALTO','MEDIO','BAJO','SIN STOCK','ULTIMAS UNIDADES',
      'ÚLTIMAS UNIDADES','ULTIMAS','ÚLTIMAS','MUY BAJO STOCK','S/STOCK','SIN']);

    const esDispExacto = v => {
      if (!v) return false;
      return DISP_EXACTOS.has(String(v).trim().toUpperCase());
    };

    // Recorrer todas las hojas
    wb.SheetNames.forEach(nombreHoja => {
      const ws = wb.Sheets[nombreHoja];
      if (!ws) return;
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: false });
      totalFilasEscaneadas += rows.length;

      console.log(`\n[XLSX] === Hoja "${nombreHoja}" - ${rows.length} filas ===`);
      if (rows.length > 0) {
        console.log('[XLSX] Primera fila:', JSON.stringify(rows[0]));
        console.log('[XLSX] Segunda fila:', JSON.stringify(rows[1]));
      }

      // Guardar dump por si falla todo
      dumpHojas.push({
        nombre: nombreHoja,
        totalFilas: rows.length,
        primerasFilas: rows.slice(0, 5)
      });

      const tripletas = [];

      // ESTRATEGIA 1: Buscar headers "SKU" y "DISPONIBILIDAD"
      for (let rowIdx = 0; rowIdx < Math.min(rows.length, 10); rowIdx++) {
        const row = rows[rowIdx] || [];
        for (let c = 0; c < row.length; c++) {
          const cell = row[c];
          if (!cell) continue;
          const norm = String(cell).trim().toUpperCase();
          if (norm === 'SKU' || norm === 'CÓDIGO' || norm === 'CODIGO') {
            // Buscar "DISPONIBILIDAD" a la derecha
            for (let d = c + 1; d < Math.min(c + 6, row.length); d++) {
              const cc = row[d];
              if (cc && String(cc).trim().toUpperCase().includes('DISPONIB')) {
                if (!tripletas.some(t => t.skuCol === c)) {
                  tripletas.push({ skuCol: c, nomCol: c + 1, dispCol: d, metodo: 'header' });
                }
                break;
              }
            }
          }
        }
      }

      // ESTRATEGIA 2: Si no encontró por header, buscar por contenido
      // Una columna es "Disponibilidad" si tiene >5 valores ALTO/MEDIO/BAJO/SIN STOCK
      if (tripletas.length === 0 && rows.length > 5) {
        const numCols = Math.max(...rows.map(r => (r || []).length));
        const conteoDisp = new Array(numCols).fill(0);
        // Conteo estricto: cuántas celdas de la columna son EXACTAMENTE un
        // rótulo de disponibilidad. Se usa para descartar tripletas falsas
        // (ver más abajo); no reemplaza a conteoDisp, que sigue siendo el
        // criterio permisivo para detectar la columna de disponibilidad.
        const conteoDispExacto = new Array(numCols).fill(0);

        rows.forEach(row => {
          if (!row) return;
          for (let c = 0; c < numCols; c++) {
            if (esValorDisp(row[c]))   conteoDisp[c]++;
            if (esDispExacto(row[c]))  conteoDispExacto[c]++;
          }
        });

        console.log('[XLSX] Conteo de valores tipo disponibilidad por columna:', conteoDisp);

        // Para cada columna que parece disponibilidad, asumir que SKU está 2 a la izquierda y Nombre 1 a la izquierda
        conteoDisp.forEach((conteo, dispCol) => {
          if (conteo >= 5 && dispCol >= 2) {
            const skuCol = dispCol - 2;
            const nomCol = dispCol - 1;

            // La columna candidata a NOMBRE no puede ser, a su vez, una
            // columna de disponibilidad. Sin este chequeo las hojas de log
            // del Excel de stock (LOG_CAMBIOS: Fecha | SKU | Anterior | Nuevo)
            // se leen como si fueran una tabla de productos: "Anterior" pasa
            // por nombre y "Nuevo" por disponibilidad, y cada fila del log
            // pisa el dato real del SKU en nuevoMap. El filtro por fila que
            // hay más abajo no alcanza, porque sólo descarta los rótulos
            // conocidos: un valor como "MUY BAJO STOCK" se cuela como nombre
            // y arrastra la disponibilidad vieja del log (ej. SKU 6843, que
            // con stock MEDIO quedaba marcado SIN STOCK y desaparecía del PDF).
            if (conteoDispExacto[nomCol] >= 5) {
              console.log(`[XLSX] Descartada tripleta ${skuCol}/${nomCol}/${dispCol}: la columna ${nomCol} es de disponibilidad, no de nombres.`);
              return;
            }

            if (!tripletas.some(t => t.skuCol === skuCol)) {
              tripletas.push({ skuCol, nomCol, dispCol, metodo: 'contenido' });
            }
          }
        });
      }

      console.log(`[XLSX] Tripletas detectadas en "${nombreHoja}":`, tripletas);

      // Extraer productos
      let productosHoja = 0;
      rows.forEach((row, rowIdx) => {
        if (!row) return;
        tripletas.forEach(({ skuCol, nomCol, dispCol }) => {
          const sku = row[skuCol];
          const nom = row[nomCol];
          const dis = row[dispCol];
          if (!nom || !dis) return;

          let skuNum = null;
          if (typeof sku === 'number') skuNum = Math.round(sku);
          else if (typeof sku === 'string' && /^\d+$/.test(sku.trim())) skuNum = parseInt(sku.trim());

          // Rechazar valores fuera del rango realista de SKUs (evita fechas Excel ~46000)
          if (!skuNum || skuNum < 1000 || skuNum > 19999) return;

          // Validar que la disponibilidad parezca un valor válido
          const dispStr = String(dis).trim().toUpperCase();
          if (!esValorDisp(dispStr)) return;

          const clean = String(nom).replace(/\s*LEUK\s*$/i, '').trim().toUpperCase();

          // Si el "nombre" es exactamente un valor de disponibilidad, la columna está
          // mal detectada. Usamos comparación EXACTA (no startsWith) para no filtrar
          // productos cuyo nombre empiece con "SIN" (ej: SINTRA) o "ULTRA" etc.
          if (DISP_EXACTOS.has(clean)) return;

          // Se guarda ya traducido al vocabulario de ESTADOS_DISP: STOCK_MAP
          // es la única fuente que leen el render, los badges y las stats,
          // así que el alias se resuelve acá una sola vez.
          nuevoMap[skuNum] = { nombre: clean, disp: normalizarDisp(dispStr) };
          productosHoja++;
        });
      });
      console.log(`[XLSX] Productos extraídos de "${nombreHoja}": ${productosHoja}`);
    });

    console.log(`[XLSX] === TOTAL: ${Object.keys(nuevoMap).length} productos ===`);

    if (Object.keys(nuevoMap).length === 0) {
      // Imprimir dump completo en consola para diagnosticar
      console.error('[XLSX] No se pudo extraer ningún producto. Dump de hojas:');
      dumpHojas.forEach(h => {
        console.error(`\n--- Hoja "${h.nombre}" (${h.totalFilas} filas) ---`);
        h.primerasFilas.forEach((row, i) => {
          console.error(`  Fila ${i}:`, JSON.stringify(row));
        });
      });

      if (!silencioso) alert(
        '⚠️ No se encontraron productos en el Excel.\n\n' +
        'Se mantienen los datos actuales.\n\n' +
        'Hojas encontradas: ' + wb.SheetNames.join(', ') + '\n' +
        'Filas escaneadas: ' + totalFilasEscaneadas + '\n\n' +
        '🔍 Abrí la consola del navegador (F12 → Console)\n' +
        '   para ver el contenido de las primeras filas\n' +
        '   y diagnosticar el problema.'
      );
      return 0;
    }

    // Reemplazar STOCK_MAP solo si el nuevo tiene datos
    Object.keys(STOCK_MAP).forEach(k => delete STOCK_MAP[k]);
    Object.keys(nuevoMap).forEach(k => STOCK_MAP[k] = nuevoMap[k]);

    // Contar por estado
    const stats = { ALTO:0, MEDIO:0, BAJO:0, 'ULTIMAS UNIDADES':0, 'SIN STOCK':0, OTROS:0 };
    Object.values(STOCK_MAP).forEach(p => {
      if (stats.hasOwnProperty(p.disp)) stats[p.disp]++;
      else stats.OTROS++;
    });

    const stockOK = stats.ALTO + stats.MEDIO + stats.BAJO + stats['ULTIMAS UNIDADES'];
    if (!silencioso) alert(
      `✓ Excel cargado correctamente.\n\n` +
      `Total productos: ${Object.keys(nuevoMap).length}\n` +
      `Con stock: ${stockOK}\n` +
      `Sin stock: ${stats['SIN STOCK']}\n` +
      (stats.OTROS > 0 ? `Con disponibilidad desconocida: ${stats.OTROS}\n` : '') +
      `\nDetalle: ALTO=${stats.ALTO}, MEDIO=${stats.MEDIO}, BAJO=${stats.BAJO}, ÚLTIMAS=${stats['ULTIMAS UNIDADES']}`
    );

    return Object.keys(nuevoMap).length;
}

function loadXLSX(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      console.log('[XLSX] Iniciando lectura del archivo:', file.name, file.size, 'bytes');
      const wb = XLSX.read(e.target.result, { type: 'array' });
      console.log('[XLSX] Hojas encontradas:', wb.SheetNames);

      procesarLibroStock(wb, false);
      render();
    } catch(err) {
      console.error('[XLSX] Error:', err);
      alert('Error leyendo Excel: ' + err.message + '\n\nMirá la consola (F12) para más detalles.\n\nLos datos actuales se mantienen sin cambios.');
    }
  };
  r.onerror = err => {
    console.error('[XLSX] FileReader error:', err);
    alert('Error leyendo el archivo. Asegurate de que sea un .xlsx válido.');
  };
  r.readAsArrayBuffer(file);
}

/* ----------------------------------------------------------------
   LEER ZIP DE FOTOS
   Espera archivos con el SKU en el nombre:
     6792.jpg, 6793.png, foto_6792.jpg, COLGANTE-PIETRO-6792.jpg, etc.
   Busca un número de 4 o 5 dígitos en el nombre y lo matchea con STOCK_MAP.
   ---------------------------------------------------------------- */
/* ----------------------------------------------------------------
   COMPRIMIR IMAGEN — redimensiona y convierte a JPEG
   Esto evita que el navegador colapse con cientos de PNG pesados.
   Una imagen de 5MB se reduce a ~50KB sin perder calidad visible
   en tarjetas pequeñas del PDF.
   ---------------------------------------------------------------- */
async function comprimirImagen(blob, anchoMax = 600, calidad = 0.85) {
  try {
    // Crear bitmap desde el blob (más rápido que Image en memoria)
    const bitmap = await createImageBitmap(blob);

    // Calcular nuevas dimensiones manteniendo proporción
    let { width, height } = bitmap;
    if (width > anchoMax) {
      height = Math.round(height * (anchoMax / width));
      width  = anchoMax;
    }

    // Renderizar en canvas off-screen
    const canvas = document.createElement('canvas');
    canvas.width  = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    // Los PNG conservan el fondo transparente (antes se pintaban de blanco
    // y se pasaban a JPG: por eso aparecían con fondo). El resto sigue igual.
    const esPng = /png/i.test(blob.type || '');
    if (!esPng) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
    }
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();   // liberar memoria

    return await new Promise(resolve => {
      if (esPng) canvas.toBlob(b => resolve(b || blob), 'image/png');
      else canvas.toBlob(b => resolve(b || blob), 'image/jpeg', calidad);
    });
  } catch (err) {
    // Si algo falla (formato raro, etc.), devolvemos el blob original
    console.warn('[ZIP] No se pudo comprimir imagen, se usa original:', err);
    return blob;
  }
}

async function loadZipPhotos(file) {
  if (!file) return;
  if (typeof JSZip === 'undefined') {
    alert('JSZip no cargó. Revisá la conexión a internet y recargá la página.');
    return;
  }

  showOverlay('LEYENDO ZIP', 'Descomprimiendo archivo…', true);
  DIAG_LOG = [];   // reset diagnóstico

  try {
    const zip = await JSZip.loadAsync(file);

    // Filtrar solo imágenes
    const imagenes = [];
    zip.forEach((path, entry) => {
      if (entry.dir) return;
      const ext = path.split('.').pop().toLowerCase();
      if (['jpg','jpeg','png','webp','gif'].includes(ext)) {
        imagenes.push({ path, entry });
      }
    });

    if (imagenes.length === 0) {
      hideOverlay();
      alert('El zip no contiene imágenes (jpg/png/webp).');
      return;
    }

    // Liberar objectURLs previos
    Object.values(PHOTO_MAP).forEach(url => URL.revokeObjectURL(url));
    Object.keys(PHOTO_MAP).forEach(k => delete PHOTO_MAP[k]);

    // Construir lista de SKUs válidos
    const skusValidos = new Set(Object.keys(STOCK_MAP).map(Number));
    console.log(`[ZIP] SKUs válidos en el catálogo: ${skusValidos.size}`);
    console.log(`[ZIP] Archivos de imagen en el zip: ${imagenes.length}`);

    // ============================================================
    // DICCIONARIO DE ABREVIATURAS Y SINÓNIMOS
    // Mapea forma corta → forma canónica (la palabra que debería tener el match)
    // Las claves se buscan como palabras completas en filenames
    // ============================================================
    const ABREVIATURAS = {
      // Colores básicos
      'bl':    'blanco',
      'ng':    'negro',
      'blng':  'blanconegro',     // combinación blanco+negro
      'ngbl':  'blanconegro',
      'vr':    'verde',
      'az':    'azul',
      'cb':    'terracota',
      'tc':    'terracota',
      'md':    'madera',
      'mad':   'madera',
      'gr':    'gris',
      'bd':    'bordo',
      'dr':    'dorado',
      'crm':   'cromo',
      'pl':    'plateado',
      'mr':    'marron',

      // Variantes
      'i':     '1',
      'ii':    '2',
      'iii':   '3',
      'iv':    '4',
      'v':     '5',

      // Números/cantidad
      '1ef':   '1ef',
      '3ef':   '3ef',
    };

    // Palabras del nombre del producto que se asocian con cada forma canónica
    const SINONIMOS_PRODUCTO = {
      'blanco':       ['blanco','bl'],
      'negro':        ['negro','ng'],
      'blanconegro':  ['blanco','negro','y'],   // si el producto dice "BLANCO Y NEGRO"
      'verde':        ['verde','militar','vr'],
      'azul':         ['azul','marino','az'],
      'terracota':    ['terracota','cb','tc'],
      'madera':       ['madera','mad','md'],
      'gris':         ['gris','gr'],
      'bordo':        ['bordo','bd'],
      'dorado':       ['dorado','dr'],
      'cromo':        ['cromo','crm'],
      'plateado':     ['plateado','pl'],
      'marron':       ['marron','mr'],
      '1':            ['1','i'],
      '2':            ['2','ii'],
      '3':            ['3','iii'],
      '4':            ['4','iv'],
      '5':            ['5','v'],
    };

    // Detectar el "color/variante" presente en una lista de palabras
    // Devuelve forma canónica o null
    const detectarColor = (palabras) => {
      const set = new Set(palabras);
      // Caso especial: BLANCO Y NEGRO o BLNG → blanconegro
      if ((set.has('blanco') && set.has('negro')) || set.has('blng') || set.has('ngbl')) {
        return 'blanconegro';
      }
      const ordenColores = ['blanco','negro','verde','azul','terracota','madera','gris','bordo','dorado','cromo','plateado','marron'];
      for (const color of ordenColores) {
        const sinos = SINONIMOS_PRODUCTO[color] || [];
        for (const s of sinos) if (set.has(s)) return color;
      }
      return null;
    };

    const detectarRomano = (palabras) => {
      const set = new Set(palabras);
      const orden = ['5','4','3','2','1'];   // primero más altos para no confundir "iii" con "i"
      for (const num of orden) {
        const sinos = SINONIMOS_PRODUCTO[num] || [];
        for (const s of sinos) if (set.has(s)) return num;
      }
      return null;
    };

    // Normaliza y expande abreviaturas conocidas a su forma canónica
    const normalizar = s => String(s)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    // Tokeniza y devuelve también una versión "canonizada" (con colores expandidos)
    const tokenizarCanon = s => {
      const tokens = normalizar(s).split(' ').filter(Boolean);
      const canon  = tokens.map(t => {
        // Si el token es una abreviatura conocida, la convierto a canónica
        if (ABREVIATURAS[t]) return ABREVIATURAS[t];
        return t;
      });
      return { tokens, canon };
    };

    // Construir índice del catálogo: cada producto tiene tokens canonicos + color + romano
    // así podemos comparar archivo vs producto con scoring.
    const indiceProductos = [];   // [{ sku, tokens, color, romano, nombreOrig }]
    for (const [sku, prod] of Object.entries(STOCK_MAP)) {
      const { canon } = tokenizarCanon(prod.nombre);
      indiceProductos.push({
        sku: parseInt(sku),
        tokens: canon,
        color:  detectarColor(canon),
        romano: detectarRomano(canon),
        nombreOrig: prod.nombre
      });
    }
    console.log(`[ZIP] Índice del catálogo: ${indiceProductos.length} productos`);

    // STOPWORDS — palabras irrelevantes para matching
    const STOPWORDS = new Set([
      'de','la','el','con','para','por','del','los','las','en','y','o','a','sin',
      // genéricas que aparecen en muchos productos
      'leuk','luminaria','exterior','techo','pared','piso','mesa',
      // unidades técnicas que muchas veces no están en el filename
      'cri','ip','ip20','ip65','ip44','ip55','lm','w','k','3cct',
    ]);

    let matched = 0;
    let noMatch = 0;
    let duplicados = 0;
    const archivosSinMatch = [];
    const skusSinFoto      = new Set(skusValidos);
    const stats = { exacto:0, sku:0, scoring:0 };

    for (let i = 0; i < imagenes.length; i++) {
      const { path, entry } = imagenes[i];
      const filename = path.split('/').pop();
      const sinExt   = filename.replace(/\.[^.]+$/, '');

      // ============================================================
      // INFO DE LA RUTA COMPLETA
      // El producto puede estar identificado por:
      //   - El filename:   "ACRU-BL.png"
      //   - La subcarpeta: ".../EMPOTRABLES/ACRU BL/foto.png"  ← caso típico LEUK
      //   - Combinación de ambos
      // ============================================================
      const partesPath = path.split('/').filter(p => p && !p.match(/\.(jpg|jpeg|png|webp|gif)$/i));
      // partesPath ahora son las carpetas (sin el archivo)
      // ej: ["DE PARED", "EMPOTRABLES", "ACRU BL"]

      // Tomamos las últimas 2 carpetas para tener más contexto
      // (a veces la carpeta más cercana es "v2/" o similar y el producto está en la padre)
      const carpetaProducto = partesPath[partesPath.length - 1] || '';
      const carpetaPadre    = partesPath[partesPath.length - 2] || '';

      // Construimos un texto compuesto con las 2 últimas carpetas + filename
      // para capturar tanto el nombre del producto como variantes
      const textoBusqueda = (carpetaPadre + ' ' + carpetaProducto + ' ' + sinExt).trim();

      // Tokens del filename solo (para SKU/numbers)
      const { canon: tokensFilename } = tokenizarCanon(sinExt);

      // Tokens combinados (carpeta + filename) para scoring por nombre
      const { canon: tokensArchivo } = tokenizarCanon(textoBusqueda);
      const colorArchivo  = detectarColor(tokensArchivo);
      const romanoArchivo = detectarRomano(tokensArchivo);

      let skuEncontrado = null;
      let metodoMatch = '';

      // ESTRATEGIA 1: SKU directo en el filename o en la ruta
      // Los SKU de LEUK son SIEMPRE de 4 dígitos exactos (no 3, no 5).
      // El \b (word boundary) y la lookahead/lookbehind aseguran que matcheamos
      // un grupo de exactamente 4 dígitos, ignorando 1234567 o 567.
      const nums = path.match(/(?<!\d)\d{4}(?!\d)/g) || [];
      for (const n of nums) {
        const parsed = parseInt(n);
        if (skusValidos.has(parsed)) {
          skuEncontrado = parsed;
          metodoMatch = 'sku';
          stats.sku++;
          break;
        }
      }

      // ESTRATEGIA 2: Scoring por palabras + COLOR + ROMANO
      // Calculamos el score contra cada producto del catálogo y ganamos el de mejor score.
      if (skuEncontrado === null) {
        // Palabras "significativas" del archivo (no stopwords, ni números cortos sueltos
        // a menos que sean número romano o de modelo)
        const palabrasArchivo = tokensArchivo.filter(p =>
          (p.length >= 3 && !STOPWORDS.has(p)) || /^\d+$/.test(p)
        );
        const setArchivo = new Set(palabrasArchivo);

        if (palabrasArchivo.length >= 1) {
          let mejorScore = 0;
          let mejorSku   = null;

          for (const prod of indiceProductos) {
            const palabrasProd = prod.tokens.filter(p =>
              (p.length >= 3 && !STOPWORDS.has(p)) || /^\d+$/.test(p)
            );
            const setProd = new Set(palabrasProd);

            // Contar palabras compartidas
            let coincidencias = 0;
            for (const w of palabrasArchivo) if (setProd.has(w)) coincidencias++;
            if (coincidencias === 0) continue;

            // BONUS / PENALIZACIONES por color
            let bonus = 0;
            if (colorArchivo && prod.color) {
              if (colorArchivo === prod.color) bonus += 5;       // mismo color = +5
              else                              bonus -= 10;      // distinto color = -10 (descalifica)
            } else if (colorArchivo && !prod.color) {
              // archivo dice color, producto no tiene → no penalizar tanto
              bonus -= 1;
            } else if (!colorArchivo && prod.color) {
              // archivo no dice color, producto sí → leve penalización
              bonus -= 1;
            }

            // BONUS por número romano coincidente
            if (romanoArchivo && prod.romano) {
              if (romanoArchivo === prod.romano) bonus += 3;
              else                                bonus -= 5;
            }

            // BONUS por wattage coincidente (ej. 6W, 12W, 28W, 36W, 45W)
            // Buscamos patrones tipo "6w", "12w", "20w" en ambos
            const reW = /(\d+)w\b/g;
            const wattsArchivo = [...textoBusqueda.toLowerCase().matchAll(reW)].map(m => m[1]);
            const wattsProd    = [...prod.nombreOrig.toLowerCase().matchAll(reW)].map(m => m[1]);
            if (wattsArchivo.length > 0 && wattsProd.length > 0) {
              const setWP = new Set(wattsProd);
              const algunoCoincide = wattsArchivo.some(w => setWP.has(w));
              if (algunoCoincide) bonus += 3;
              else                bonus -= 5;
            }

            // Score = coincidencias + bonus
            // Ratio sobre el archivo: cuántas palabras del archivo están en el producto
            const ratio = coincidencias / Math.max(palabrasArchivo.length, 1);
            const score = coincidencias * 2 + bonus + ratio * 3;

            // Solo competir si tenemos al menos 1 coincidencia significativa
            // y el ratio sobre el archivo es decente
            if (score > mejorScore && coincidencias >= 1 && ratio >= 0.4) {
              mejorScore = score;
              mejorSku   = prod.sku;
            }
          }

          if (mejorSku && mejorScore >= 4) {
            skuEncontrado = mejorSku;
            metodoMatch = `scoring (${mejorScore.toFixed(1)})`;
            stats.scoring++;
          }
        }
      }

      // Aplicar match
      if (skuEncontrado === null) {
        noMatch++;
        if (archivosSinMatch.length < 50) archivosSinMatch.push(filename);
        // Diagnóstico: guardar info completa
        DIAG_LOG.push({ path, filename, carpetaProducto, carpetaPadre, textoBusqueda, resultado: 'NO MATCH', sku: null, metodo: null });
      } else if (PHOTO_MAP[skuEncontrado]) {
        duplicados++;
        DIAG_LOG.push({ path, filename, carpetaProducto, carpetaPadre, textoBusqueda, resultado: 'DUPLICADO', sku: skuEncontrado, metodo: metodoMatch });
      } else {
        const blobOriginal = await entry.async('blob');
        // Comprimir/redimensionar para que el navegador no se trabe con muchas fotos
        const blobChico = await comprimirImagen(blobOriginal, 600, 0.85);
        PHOTO_MAP[skuEncontrado] = URL.createObjectURL(blobChico);
        skusSinFoto.delete(skuEncontrado);
        matched++;
        DIAG_LOG.push({ path, filename, carpetaProducto, carpetaPadre, textoBusqueda, resultado: 'OK', sku: skuEncontrado, metodo: metodoMatch });
      }

      // Actualizar progreso cada 15 archivos para no trabar la UI
      if (i % 15 === 0 || i === imagenes.length - 1) {
        const pct = Math.round(((i+1) / imagenes.length) * 100);
        updateOverlayProgress(pct, `${i+1}/${imagenes.length} archivos · ${matched} vinculadas`);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    hideOverlay();
    updateFotosPill();

    // Logs detallados en consola
    console.log(`[ZIP] Resumen: ${matched} vinculadas, ${noMatch} sin SKU, ${duplicados} duplicados`);
    if (archivosSinMatch.length > 0) {
      console.warn('[ZIP] Archivos cuyos nombres NO contienen un SKU reconocible:');
      archivosSinMatch.forEach(n => console.warn('  → ' + n));
    }
    if (skusSinFoto.size > 0 && skusSinFoto.size <= 50) {
      console.warn('[ZIP] SKUs sin foto:', [...skusSinFoto].sort((a,b)=>a-b).join(', '));
    } else if (skusSinFoto.size > 50) {
      console.warn(`[ZIP] ${skusSinFoto.size} SKUs quedaron sin foto`);
    }

    let msg = `✓ ${matched} fotos vinculadas a productos.\n\n`;
    msg += `📦 Archivos en el zip: ${imagenes.length}\n`;
    msg += `📋 SKUs en el catálogo: ${skusValidos.size}\n`;
    if (noMatch > 0) {
      msg += `\n⚠️ ${noMatch} archivos NO se vincularon.\n`;
      msg += `Ejemplos de los nombres:\n`;
      archivosSinMatch.slice(0, 8).forEach(n => msg += `   • ${n}\n`);
      if (archivosSinMatch.length > 8) msg += `   ... y ${archivosSinMatch.length - 8} más (ver consola)\n`;
    }
    if (duplicados > 0) msg += `\n↻ ${duplicados} archivos con SKU repetido (se usó el primero)`;
    if (skusSinFoto.size > 0) {
      msg += `\n\n${skusSinFoto.size} productos del catálogo quedaron SIN foto.`;
    }
    alert(msg);

    render();

  } catch(err) {
    hideOverlay();
    alert('Error leyendo el zip: ' + err.message);
  }
}

/* ----------------------------------------------------------------
   DRAG & DROP — ambos drop-zones aceptan cualquier tipo
   ---------------------------------------------------------------- */
function wireDrop(el) {
  ['dragover','dragenter'].forEach(ev => el.addEventListener(ev, e => {
    e.preventDefault(); el.classList.add('drag');
  }));
  ['dragleave','dragend'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('drag')));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    if (f.name.match(/\.zip$/i)) {
      alert('Las fotos ya no se cargan a mano.\n\nSalen siempre de la carpeta de fotos del Drive: subí o reemplazá ahí la foto (con el SKU al principio del nombre) y aparece sola al día siguiente.');
    } else if (f.name.match(/\.xlsx$/i)) {
      // Detectar si es familias o stock por nombre del archivo
      const nombre = f.name.toLowerCase();
      if (nombre.includes('famil') || nombre.includes('organi') || nombre.includes('colecc')) {
        loadFamilias(f);
      } else {
        loadXLSX(f);
      }
    } else {
      alert('Formato no soportado. Subí un .xlsx.');
    }
  });
}
wireDrop(document.getElementById('drop-xlsx'));
wireDrop(document.getElementById('drop-familias'));

/* ----------------------------------------------------------------
   EXPORTAR DIAGNÓSTICO DEL ZIP
   Genera un .txt con info completa para debuggear el matching de fotos
   ---------------------------------------------------------------- */
function exportarDiagnostico() {
  if (DIAG_LOG.length === 0) {
    alert('Las fotos todavía se están cargando. Probá de nuevo en un momento.');
    return;
  }

  const skusValidos = new Set(Object.keys(STOCK_MAP).map(Number));
  const skusConFoto = new Set(Object.keys(PHOTO_MAP).map(Number));
  const skusSinFoto = [...skusValidos].filter(s => !skusConFoto.has(s));

  let txt = '';
  txt += '═══════════════════════════════════════════════════════════════\n';
  txt += '  DIAGNÓSTICO DEL MATCHING DE FOTOS — LEUK STOCK\n';
  txt += '═══════════════════════════════════════════════════════════════\n\n';

  txt += 'RESUMEN\n';
  txt += '─────────────────────────────────────────────────────────────\n';
  txt += `SKU revisados: ${DIAG_LOG.length}\n`;
  txt += `SKUs en el catálogo: ${skusValidos.size}\n`;
  txt += `SKUs con foto: ${skusConFoto.size}\n`;
  txt += `SKUs SIN foto: ${skusSinFoto.length}\n\n`;

  const ok        = DIAG_LOG.filter(x => x.resultado === 'OK');
  const noMatch   = DIAG_LOG.filter(x => x.resultado === 'NO MATCH');
  const duplicados = DIAG_LOG.filter(x => x.resultado === 'DUPLICADO');

  txt += `Vinculadas correctamente: ${ok.length}\n`;
  txt += `Sin match (no encontró producto): ${noMatch.length}\n`;
  txt += `Duplicadas (mismo SKU varias veces): ${duplicados.length}\n\n\n`;

  // === ARCHIVOS QUE NO MATCHEARON ===
  txt += '═══════════════════════════════════════════════════════════════\n';
  txt += `  ARCHIVOS SIN MATCH (${noMatch.length})\n`;
  txt += '═══════════════════════════════════════════════════════════════\n\n';
  noMatch.forEach((x, i) => {
    txt += `${i+1}. RUTA: ${x.path}\n`;
    txt += `   Carpeta padre:    "${x.carpetaPadre}"\n`;
    txt += `   Carpeta producto: "${x.carpetaProducto}"\n`;
    txt += `   Texto búsqueda:   "${x.textoBusqueda}"\n\n`;
  });

  // === ARCHIVOS QUE SÍ MATCHEARON ===
  txt += '\n═══════════════════════════════════════════════════════════════\n';
  txt += `  ARCHIVOS VINCULADOS (${ok.length})\n`;
  txt += '═══════════════════════════════════════════════════════════════\n\n';
  ok.forEach((x, i) => {
    const prod = STOCK_MAP[x.sku];
    const nombreProd = prod ? prod.nombre : '???';
    txt += `${i+1}. ${x.path}  →  SKU ${x.sku} (${x.metodo})\n`;
    txt += `   Producto: ${nombreProd}\n\n`;
  });

  // === DUPLICADOS ===
  if (duplicados.length > 0) {
    txt += '\n═══════════════════════════════════════════════════════════════\n';
    txt += `  ARCHIVOS DUPLICADOS — mismo SKU vinculado a otra foto antes (${duplicados.length})\n`;
    txt += '═══════════════════════════════════════════════════════════════\n\n';
    duplicados.forEach((x, i) => {
      txt += `${i+1}. ${x.path}  →  SKU ${x.sku} (ya estaba vinculado)\n`;
    });
  }

  // === SKUs SIN FOTO ===
  txt += '\n\n═══════════════════════════════════════════════════════════════\n';
  txt += `  PRODUCTOS DEL CATÁLOGO QUE QUEDARON SIN FOTO (${skusSinFoto.length})\n`;
  txt += '═══════════════════════════════════════════════════════════════\n\n';
  skusSinFoto.sort((a,b) => a-b).forEach(sku => {
    const prod = STOCK_MAP[sku];
    txt += `SKU ${sku}: ${prod.nombre}  [${prod.disp}]\n`;
  });

  // Descargar como archivo
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `LEUK_diagnostico_fotos_${fechaISOElegida()}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ----------------------------------------------------------------
   MODO EDICIÓN — INTERACCIONES SOBRE EL PDF EN LA PREVIEW
   - Click en una imagen / placeholder → selecciona la tarjeta y muestra
     el toolbar flotante (borrar / duplicar / achicar / agrandar).
   - Cortes de página: zonas "+ insertar corte" entre secciones.
   - Guías A4: líneas rojas que muestran dónde caería el corte automático.
   ---------------------------------------------------------------- */

let SELECTED_CARD = null;

function deselectCard() {
  if (SELECTED_CARD) {
    SELECTED_CARD.classList.remove('is-selected');
    SELECTED_CARD = null;
  }
}

function selectCard(card) {
  if (SELECTED_CARD === card) return;
  deselectCard();
  card.classList.add('is-selected');
  SELECTED_CARD = card;
  // Sincronizar el estado enabled/disabled del botón "📥 Pegar" del toolbar
  // recién mostrado con el portapapeles actual.
  updatePasteButtons();
  // Reposiciona el toolbar si está cerca del borde superior (queda fuera de la grilla)
  const tb = card.querySelector('.foto-toolbar');
  if (tb) {
    const rect = card.getBoundingClientRect();
    if (rect.top < 60) {
      tb.style.top = 'auto';
      tb.style.bottom = '-40px';
    } else {
      tb.style.top = '';
      tb.style.bottom = '';
    }
  }
}

// Las acciones del toolbar se invocan desde el HTML con `this` apuntando al botón.
// Subimos al .product-card más cercano para operar sobre él.
function _cardFromBtn(btn) {
  return btn.closest('.product-card');
}

/* === PORTAPAPELES DE FOTOS ===
   Solo se copia / pega la imagen. El nombre del producto y el SKU son del
   Excel y NO se modifican: si pegás una foto en el recuadro de "EMPOTRABLE
   ACRU", el nombre y el SKU se mantienen — únicamente cambia la imagen. */
let CLIPBOARD_PHOTO = null;   // { src: 'blob:...' , fromSku: '6792' }

function showFlash(msg, kind) {
  let flash = document.getElementById('photo-flash');
  if (!flash) {
    flash = document.createElement('div');
    flash.id = 'photo-flash';
    flash.className = 'photo-flash';
    document.body.appendChild(flash);
  }
  flash.className = 'photo-flash' + (kind ? ' ' + kind : '');
  flash.textContent = msg;
  // Forzar reflow para reiniciar la animación si se llama dos veces seguidas
  void flash.offsetWidth;
  flash.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => flash.classList.remove('show'), 2400);
}

// Habilita/deshabilita los botones "📥 Pegar" según haya algo copiado.
// También activa la clase global `has-clipboard` en el #pdf-area, que
// prende el highlight azul en las demás tarjetas para invitar a pegar.
function updatePasteButtons() {
  const pdfArea = document.getElementById('pdf-area');
  const has = !!CLIPBOARD_PHOTO;
  if (pdfArea) pdfArea.classList.toggle('has-clipboard', has);
  document.querySelectorAll('.foto-toolbar .btn-paste').forEach(btn => {
    btn.disabled = !has;
  });
  // Marcar la tarjeta fuente con outline azul punteado
  document.querySelectorAll('.is-clipboard-source').forEach(c => c.classList.remove('is-clipboard-source'));
  if (has) {
    const src = document.querySelector(`.product-card[data-card-id="${CLIPBOARD_PHOTO.fromCardId}"]`);
    if (src) src.classList.add('is-clipboard-source');
  }
}

function copyPhoto(btn) {
  const card = _cardFromBtn(btn);
  if (!card) return;
  const img = card.querySelector('.photo-box img');
  if (!img || !img.src) {
    showFlash('Esta tarjeta no tiene foto para copiar', 'warn');
    return;
  }
  CLIPBOARD_PHOTO = {
    src: img.src,
    fromSku: card.dataset.sku || '?',
    fromCardId: card.dataset.cardId
  };
  showFlash(`📋 Foto copiada (SKU ${CLIPBOARD_PHOTO.fromSku}) · click en otra para pegar`);
  updatePasteButtons();
}

function pastePhoto(btn) {
  const card = _cardFromBtn(btn);
  if (!card || !CLIPBOARD_PHOTO) return;
  const inner = card.querySelector('.photo-box .photo-inner');
  if (!inner) return;
  // Si esta es la misma tarjeta de la que se copió, no tiene sentido pegar
  if (card.dataset.cardId === CLIPBOARD_PHOTO.fromCardId) {
    showFlash('Es la misma tarjeta de origen', 'warn');
    return;
  }
  // Reemplazar el contenido del photo-inner (puede tener un <img> o el placeholder ◌)
  inner.innerHTML = `<img src="${CLIPBOARD_PHOTO.src}" alt="" crossorigin="anonymous">`;
  showFlash(`✓ Foto pegada en SKU ${card.dataset.sku || '?'}`);
}

function deletePhoto(btn) {
  const card = _cardFromBtn(btn);
  if (!card) return;
  const inner = card.querySelector('.photo-box .photo-inner');
  if (!inner) return;
  inner.innerHTML = '<div class="photo-placeholder">◌</div>';
  showFlash('Foto borrada (queda el placeholder)');
}

/* === RESIZE DE LA FOTO ===
   Aplica un transform: scale() a la <img> mediante la variable CSS
   --photo-scale. El recuadro NO cambia: solo la imagen crece o se achica,
   centrada, manteniendo proporciones (object-fit contain garantiza que
   nunca se deforme; overflow visible garantiza que nunca se recorte aunque
   la agrandes más allá del recuadro). */
const PHOTO_SCALE_STEPS = [0.4, 0.55, 0.7, 0.85, 1, 1.15, 1.3, 1.5];

function resizePhoto(btn, delta) {
  const card = _cardFromBtn(btn);
  if (!card) return;
  const current = parseFloat(card.dataset.photoScale || '1');
  let idx = PHOTO_SCALE_STEPS.indexOf(current);
  if (idx === -1) {
    // No es exactamente uno de los steps → buscar el más cercano
    idx = PHOTO_SCALE_STEPS.reduce((best, s, i) => (
      Math.abs(s - current) < Math.abs(PHOTO_SCALE_STEPS[best] - current) ? i : best
    ), 3);
  }
  idx = Math.max(0, Math.min(PHOTO_SCALE_STEPS.length - 1, idx + delta));
  const next = PHOTO_SCALE_STEPS[idx];
  card.dataset.photoScale = next;
  card.style.setProperty('--photo-scale', next);
  // Si ya está en el extremo, parpadeo del botón para indicar tope
  if (next === current) {
    btn.style.transform = 'scale(0.85)';
    setTimeout(() => btn.style.transform = '', 120);
  }
}

// Click delegado sobre #pdf-area: selecciona tarjeta al tocar la foto/placeholder.
function attachCardClickHandler() {
  const area = document.getElementById('pdf-area');
  if (!area || area._editingWired) return;
  area._editingWired = true;

  area.addEventListener('click', (e) => {
    // Si clickearon adentro del toolbar, no hacer nada (los botones tienen su propio onclick)
    if (e.target.closest('.foto-toolbar')) return;
    // Click en una nota interactiva → saltar a la otra versión del producto.
    // Va ANTES de todo lo demás para que no se dispare la selección de tarjeta.
    const notaLink = e.target.closest('.prod-nota-link');
    if (notaLink) {
      irADestinoNota(notaLink);
      e.stopPropagation();
      return;
    }
    // Si clickearon una "X" de un corte de página, manejarlo aparte
    if (e.target.classList && e.target.classList.contains('remove-break')) {
      const brk = e.target.closest('.pdf-page-break');
      if (brk) brk.remove();
      e.stopPropagation();
      return;
    }
    // Si clickearon una zona "+ insertar corte"
    if (e.target.classList && e.target.classList.contains('insert-break-zone')) {
      insertPageBreakAt(e.target);
      e.stopPropagation();
      return;
    }
    // Si clickearon dentro de una imagen / placeholder → seleccionar tarjeta
    const photoTarget = e.target.closest('.photo-box, .photo-placeholder');
    if (photoTarget) {
      const card = photoTarget.closest('.product-card');
      if (card) {
        selectCard(card);
        e.stopPropagation();
        return;
      }
    }
    // Click en cualquier otro lado → deseleccionar
    deselectCard();
  });

  // También deseleccionar si se clickea fuera del #pdf-area
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#pdf-area')) deselectCard();
  });

  // ESC también deselecciona
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') deselectCard();
  });
}

// Inserta un corte de página ANTES del elemento siguiente al "insert-zone" clickeado.
function insertPageBreakAt(zone) {
  const brk = document.createElement('div');
  brk.className = 'pdf-page-break';
  brk.innerHTML = '<button type="button" class="remove-break" title="Quitar corte de página">×</button>';
  zone.parentNode.insertBefore(brk, zone.nextSibling);
}

// Después de cada render(), insertar zonas "+ insertar corte" entre cada
// par de secciones consecutivas.
function attachInsertBreakZones() {
  const area = document.getElementById('pdf-area');
  if (!area) return;
  // Limpiar zonas previas (si llamamos render() dos veces)
  area.querySelectorAll('.insert-break-zone').forEach(z => z.remove());

  // Insertar una zona después de la portada y entre cada sección
  const breakables = area.querySelectorAll('.portada, section.seccion');
  breakables.forEach(el => {
    const zone = document.createElement('div');
    zone.className = 'insert-break-zone';
    if (el.nextSibling) {
      el.parentNode.insertBefore(zone, el.nextSibling);
    } else {
      el.parentNode.appendChild(zone);
    }
  });
}

// Toggle de las guías A4
function toggleGuides() {
  const area = document.getElementById('pdf-area');
  const btn  = document.getElementById('btn-guides');
  area.classList.toggle('show-guides');
  btn.classList.toggle('activo', area.classList.contains('show-guides'));
}

// Marca cuando hay fotos cargadas (cambia el cursor sobre las imágenes)
function markFotosLoadedClass() {
  const area = document.getElementById('pdf-area');
  if (!area) return;
  area.classList.toggle('fotos-loaded', Object.keys(PHOTO_MAP).length > 0);
}

// Espera a que TODAS las imágenes del #pdf-area estén decodificadas.
// Esto soluciona las "fotos blancas" al inicio del PDF: html2canvas
// snapshotea el DOM antes de que blob:URLs grandes terminen de decodificar.
function waitForAllImages(root) {
  const imgs = Array.from(root.querySelectorAll('img'));
  return Promise.all(imgs.map(img => {
    if (img.complete && img.naturalWidth > 0) {
      // Si ya está cargada, decode() devuelve una promesa que resuelve enseguida
      return img.decode ? img.decode().catch(() => {}) : Promise.resolve();
    }
    return new Promise(resolve => {
      const done = () => resolve();
      img.addEventListener('load',  done, { once: true });
      img.addEventListener('error', done, { once: true });
      // timeout defensivo: si una imagen nunca carga, no bloqueamos el PDF para siempre
      setTimeout(done, 8000);
    }).then(() => img.decode ? img.decode().catch(() => {}) : null);
  }));
}

/* ----------------------------------------------------------------
   ESPERAR FUENTES — fix de "tipografía bold/espaciada en el export"
   ----------------------------------------------------------------
   Síntoma: en la preview las tipografías se ven correctas (Barlow
   Condensed liviana, espaciado normal) pero al exportar el PDF/JPG
   aparecen con tracking aumentado y aspecto bold/negrita falsa.

   Causa: las Google Fonts se cargan con &display=swap, que le
   indica al browser que mientras la fuente no esté lista MUESTRE
   el texto con la fuente de fallback de sistema (Arial/Helvetica).
   html2canvas no espera fuentes — solo espera imágenes — así que
   captura el DOM antes de que Barlow Condensed esté disponible
   y rasteriza Arial. Como Arial es más ancha que Barlow Condensed
   y los font-weight 700/800 no existen en Arial regular, el
   browser hace "fake bold sintético" (engrosado por software) →
   las letras aparecen más gruesas y el letter-spacing del CSS
   se aplica sobre glifos más anchos → tracking visible.

   Solución (estándar CSS Font Loading API):
     1) document.fonts.load(spec) → fuerza el download de cada
        peso usado en el catálogo (no es opcional: el browser
        sólo descarga los pesos que cree necesitar, y en cards
        invisibles puede no haberlos pedido todavía).
     2) document.fonts.ready → resuelve cuando TODAS las fuentes
        usadas están listas para renderizar.

   Robustez: si una fuente nunca carga (sin internet, CDN bloqueado),
   el .catch silencioso permite que el export siga con fallback en
   vez de bloquearse para siempre. timeout defensivo igual que
   waitForAllImages.
   ---------------------------------------------------------------- */
const FONTS_CRITICAS = [
  // Cada entrada es un CSS font shorthand: "<weight> <size> <family>"
  // El size no afecta la elección de fuente, sólo es requerido por la API.
  '300 16px "Roboto"',
  '400 16px "Roboto"',
  '500 16px "Roboto"',
  '600 16px "Roboto"',
  '700 16px "Roboto"',
  '300 16px "Roboto Condensed"',
  '400 16px "Roboto Condensed"',
  '600 16px "Roboto Condensed"',
  '700 16px "Roboto Condensed"',
];

function waitForAllFonts(timeoutMs = 8000) {
  // Si la API no existe (browsers muy viejos), salir limpio.
  if (!document.fonts || !document.fonts.load) return Promise.resolve();

  // Forzar carga de cada peso crítico. Cada .load() rechaza si la
  // fuente no resuelve — lo silenciamos para que un peso suelto roto
  // no bloquee el resto.
  const loads = FONTS_CRITICAS.map(spec =>
    document.fonts.load(spec).catch(() => {})
  );

  // Promesa que rechaza después del timeout (no bloquear el export
  // si el CDN está caído).
  const timeout = new Promise(resolve => setTimeout(resolve, timeoutMs));

  // Race: lo que ocurra primero — todas las fuentes listas, o timeout.
  return Promise.race([
    Promise.all(loads).then(() => document.fonts.ready),
    timeout
  ]);
}

/* ----------------------------------------------------------------
   GENERAR PDF
   ---------------------------------------------------------------- */
/* ----------------------------------------------------------------
   GENERAR PDF — HOJAS DE ALTO VARIABLE, CORTE DONDE EL USUARIO DICE.
   Modelo nuevo:
     • El catálogo se parte en SEGMENTOS por los cortes manuales que
       insertó el usuario (.pdf-page-break). Si no hay cortes, todo es
       UN segmento.
     • Cada segmento se exporta como UNA hoja del PDF. El alto de esa
       hoja es exactamente la suma de los altos de los bloques que la
       componen — NO se rellena a A4. Si el segmento mide menos que A4,
       la hoja queda más corta. Si mide más, queda más larga.
     • Las hojas tienen ancho fijo (210mm = A4 width) y alto variable.
     • No hay cortes automáticos por límite de página: solo los manuales.
   Por qué cambió respecto a la versión anterior:
     El usuario reportó que el PDF metía espacios en blanco al final de
     páginas A4 y cortaba imágenes a la mitad cuando el contenido excedía
     A4 sin un corte manual. Ahora el usuario controla EXACTAMENTE dónde
     cortan las hojas; las imágenes nunca se rompen porque dentro de un
     segmento todo va seguido en una sola "página larga".
   ---------------------------------------------------------------- */
async function generatePDF() {
  showOverlay('GENERANDO PDF', 'Preparando exportación…', false);
  document.getElementById('btn-pdf').disabled = true;

  const filename = `LEUK_Stock_${fechaISO()}.pdf`;
  const el = document.getElementById('pdf-area');

  // Detección robusta de las librerías (ver scripts en <head>)
  const _html2canvas = window.html2canvas
                    || (window.html2pdf && window.html2pdf.html2canvas);
  const _jsPDF = (window.jspdf && window.jspdf.jsPDF)
              || window.jsPDF
              || (window.html2pdf && window.html2pdf.jsPDF);
  if (!_html2canvas || !_jsPDF) {
    const missing = [];
    if (!_html2canvas) missing.push('html2canvas');
    if (!_jsPDF) missing.push('jsPDF');
    alert(
      'No se pudieron cargar las librerías de PDF (' + missing.join(', ') + ').\n\n' +
      'Posibles causas:\n' +
      '• Estás abriendo el archivo sin conexión a internet (las librerías se descargan de un CDN la primera vez).\n' +
      '• Un bloqueador de scripts / red corporativa está bloqueando cdnjs.cloudflare.com.\n\n' +
      'Solución: refrescá la página estando conectado a internet. Una vez cargadas, el navegador las cachea.'
    );
    document.getElementById('btn-pdf').disabled = false;
    hideOverlay();
    return;
  }

  deselectCard();
  const teniaGuides = el.classList.contains('show-guides');
  if (teniaGuides) el.classList.remove('show-guides');

  try {
    // 1) Esperar a que TODAS las imágenes terminen de decodificarse.
    showOverlay('GENERANDO PDF', 'Esperando que carguen todas las fotos…', false);
    await waitForAllImages(el);

    // 1.bis) Esperar a que las tipografías web (Roboto / Roboto Condensed)
    //        estén disponibles. Sin esto, html2canvas captura con el
    //        fallback de sistema y el texto sale con tracking y bold falso.
    //        Ver comentario completo en la definición de waitForAllFonts().
    showOverlay('GENERANDO PDF', 'Esperando que carguen las tipografías…', false);
    await waitForAllFonts();

    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 80)));

    // 2) Agrupar los hijos del #pdf-area en SEGMENTOS. Un segmento es la
    //    lista de bloques (portada, secciones) entre dos cortes manuales
    //    (o entre el principio y un corte, o entre un corte y el final).
    const segments = [];
    let current = [];
    for (const child of Array.from(el.children)) {
      if (child.classList && child.classList.contains('pdf-page-break')) {
        if (current.length) segments.push(current);
        current = [];
        continue;
      }
      if (child.classList && child.classList.contains('insert-break-zone')) continue;
      if (child.id === 'photo-flash') continue;
      current.push(child);
    }
    if (current.length) segments.push(current);
    if (segments.length === 0) throw new Error('No hay contenido para exportar.');

    // 3) Activar modo export (CSS .exporting: oculta toolbars, desactiva
    //    mix-blend-mode que html2canvas no soporta, etc).
    el.classList.add('exporting');

    const SCALE = 4;           // resolución del canvas (4× → ~300 DPI en A4, trazos tipográficos nítidos)
    const PAGE_W_MM = 210;     // ancho de hoja en mm (A4 width)

    let pdf = null;
    let robotoAvailable = false;
    const totalBlocks = segments.reduce((s, seg) => s + seg.length, 0);
    let renderedBlocks = 0;

    // Contabilidad para los links internos de las notas (ver
    // recolectarLinksNota / aplicarLinksNota).
    const blockPos    = new Map();   // bloque DOM → { page, yMm }
    const pageHeights = [];          // alto en mm por página (1-based)
    const linksNota   = [];          // rectángulos clickeables pendientes

    showOverlay('GENERANDO PDF', `Hoja 0 / ${segments.length}…`, true);

    // 4) Procesar cada segmento → una hoja del PDF
    for (let si = 0; si < segments.length; si++) {
      const seg = segments[si];

      // 4.1) Renderizar TODOS los bloques del segmento a sus canvases
      //      individuales. Hacemos uno por uno (no todos juntos) para
      //      respetar el límite de canvas del navegador.
      const blockCanvases = [];
      for (let bi = 0; bi < seg.length; bi++) {
        const block = seg[bi];

        const canvas = await _html2canvas(block, {
          scale: SCALE,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: '#ffffff',
          imageTimeout: 15000
        });
        blockCanvases.push(canvas);
        renderedBlocks++;

        const pct = Math.round((renderedBlocks / totalBlocks) * 100);
        updateOverlayProgress(pct,
          `Hoja ${si + 1} / ${segments.length} — bloque ${bi + 1} / ${seg.length}…`);
        await new Promise(r => setTimeout(r, 0));
      }

      // 4.2) Calcular alto total del segmento en mm.
      //      Usamos el ancho del #pdf-area como referencia fija (todos los
      //      bloques deben tener ese mismo ancho en px * SCALE).
      //      Si algún canvas difiere por 1-2px de antialiasing, normalizamos.
      const refWidthPx = el.offsetWidth * SCALE;   // ancho canónico esperado
      const totalPx = blockCanvases.reduce((s, c) => s + c.height, 0);
      // Para el ratio usamos el ancho real del primer canvas (el más fiable)
      const widthPx = blockCanvases[0] ? blockCanvases[0].width : refWidthPx;
      const pageHmm = (totalPx / widthPx) * PAGE_W_MM;

      // 4.3) Crear o agregar la hoja con DIMENSIONES CUSTOM.
      //      jsPDF permite ancho×alto arbitrarios por página.
      //
      //      ★ FIX: jsPDF v2.5.1, cuando recibe `format: [W, H]` con
      //      `orientation: 'portrait'` y W > H, detecta que es
      //      matemáticamente landscape y SWAP las dimensiones para
      //      forzar portrait (queda H × W en vez de W × H). Resultado:
      //      `addImage(image, 0, 0, W, H)` dibuja con ancho W en una
      //      hoja que en realidad mide H de ancho, y la imagen se
      //      desborda por la derecha → COLUMNAS CORTADAS.
      //      Pasa cuando un segmento es corto (pageHmm < PAGE_W_MM,
      //      o sea cuando la hoja resulta de menos de 210mm de alto).
      //      Solución: pasar la orientation correcta así jsPDF no
      //      necesita swap.
      const orientation = pageHmm < PAGE_W_MM ? 'landscape' : 'portrait';
      if (pdf === null) {
        pdf = new _jsPDF({
          unit: 'mm',
          format: [PAGE_W_MM, pageHmm],
          orientation,
          compress: true
        });
        // Registrar Roboto en jsPDF para la capa de texto invisible.
        // Se hace una sola vez después de crear la primera instancia,
        // ya que addFileToVFS queda en el prototipo global.
        showOverlay('GENERANDO PDF', 'Registrando tipografía Roboto…', false);
        robotoAvailable = await ensureRobotoInJsPDF(pdf);
      } else {
        pdf.addPage([PAGE_W_MM, pageHmm], orientation);
      }
      pageHeights[si + 1] = pageHmm;   // las páginas de jsPDF son 1-based

      // 4.4) Colocar cada bloque a su Y correspondiente, uno debajo del otro.
      //      Usamos siempre widthPx como referencia para que la proporción
      //      mm/px sea consistente aunque algún canvas difiera 1-2px.
      //
      //      NUEVO (PDF buscable): después de pegar la imagen rasterizada
      //      de cada bloque, superponemos una capa de TEXTO INVISIBLE
      //      con el contenido real (nombres, SKUs, títulos). Esta capa
      //      no se ve pero es seleccionable con el mouse y encontrable
      //      con Ctrl+F. Es la misma técnica que usan los PDFs creados
      //      con OCR (Adobe Acrobat, ABBYY): el aspecto visual viene
      //      100% del raster, y el texto buscable se monta encima
      //      en modo "invisible rendering" (PDF text rendering mode 3).
      let cursorPx = 0;
      for (let bi = 0; bi < blockCanvases.length; bi++) {
        const c = blockCanvases[bi];
        const cHmm = (c.height / widthPx) * PAGE_W_MM;
        const cYmm = (cursorPx  / widthPx) * PAGE_W_MM;
        // Ancho siempre PAGE_W_MM para llenar la hoja de borde a borde
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG',
