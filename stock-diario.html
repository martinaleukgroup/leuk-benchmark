                     0, cYmm, PAGE_W_MM, cHmm);

        // Capa de texto invisible para este bloque. Posicionada en la
        // misma Y que la imagen, usando el bloque DOM original para
        // leer textos y bounding boxes.
        addInvisibleTextLayer(pdf, seg[bi], cYmm, PAGE_W_MM, robotoAvailable);

        // Pasada 1 de los links internos: dónde quedó este bloque y qué
        // notas clickeables contiene.
        blockPos.set(seg[bi], { page: si + 1, yMm: cYmm });
        recolectarLinksNota(seg[bi], cYmm, PAGE_W_MM, si + 1, linksNota);

        cursorPx += c.height;
      }
    }

    // Pasada 2: ahora que existen todas las hojas, resolver los destinos.
    showOverlay('GENERANDO PDF', 'Escribiendo links internos…', false);
    aplicarLinksNota(pdf, linksNota, blockPos, pageHeights, PAGE_W_MM);

    pdf.save(filename);

  } catch(err) {
    console.error('[PDF]', err);
    alert('Error generando PDF: ' + ((err && err.message) || err));
  } finally {
    el.classList.remove('exporting');
    if (teniaGuides) el.classList.add('show-guides');
    hideOverlay();
    document.getElementById('btn-pdf').disabled = false;
  }
}

/* ----------------------------------------------------------------
   CAPA DE TEXTO INVISIBLE (PDF buscable)
   ----------------------------------------------------------------
   Recorre todos los elementos de texto visibles dentro de `block`
   (un nodo DOM del #pdf-area) y los dibuja en el PDF con
   renderingMode='invisible'. Cada texto queda posicionado en su
   bounding box real (relativo al bloque), de modo que coincide
   con lo que el ojo ve en la imagen rasterizada.

   Por qué invisible y no blanco/transparente:
     - El render-mode 3 de PDF marca el texto como "no se dibuja
       pero se selecciona/busca". Es el estándar para PDFs OCR.
     - Si usáramos color blanco, el texto sería seleccionable pero
       el cursor de selección "tacharía" el texto cuando el fondo
       no sea blanco (banners negros, headers grises) y se notaría
       en algunos visores.

   Por qué Helvetica (default jsPDF) y no la tipo custom del usuario:
     - El aspecto visual viene 100% de la imagen JPEG ya pegada
       (que SÍ usa la tipo custom porque html2canvas la respetó).
     - La capa invisible solo necesita TEXTO + POSICIÓN para
       Ctrl+F y selección. No hace falta cargar la fuente custom
       en jsPDF (que sería un dolor de cabeza con TTF/OTF).
   ---------------------------------------------------------------- */
/* ----------------------------------------------------------------
   ROBOTO EN jsPDF — capa de texto invisible
   ----------------------------------------------------------------
   Para que la capa invisible use Roboto (igual que la capa visual),
   necesitamos embeber la fuente en jsPDF como base64. jsPDF solo
   incluye Helvetica/Courier/Times de fábrica; cualquier otra fuente
   requiere registro explícito vía addFileToVFS + addFont.

   Cargamos dos pesos desde Google Fonts CSS API v2:
     - Regular (400) → para prod-sku, sec-part-light, leuk-logo-sub
     - Bold (700)    → para prod-name, sec-part-bold, leuk-logo-txt

   El flujo es:
     1) Fetch del CSS de Google Fonts → extraer URL del .woff2
     2) Fetch del .woff2 → convertir a base64
     3) addFileToVFS + addFont en jsPDF
   Se ejecuta UNA sola vez (lazy, al primer export). Si falla (sin
   internet, CDN bloqueado), silenciamos y usamos Helvetica como
   fallback — el PDF se genera igual, solo pierde la coincidencia
   de fuente en la capa invisible.

   IMPORTANTE — formato TTF, no woff2:
   jsPDF espera TTF/OTF. Si se le pasa woff2 (que es lo que Google
   Fonts CSS entrega por defecto), el campo /BBox de la fuente queda
   mal formado y Acrobat muestra un warning de "cuadro /BBox erróneo"
   aunque el PDF se visualice correctamente. Cargamos los TTF
   directamente desde el repositorio oficial de Google Fonts en GitHub
   (raw.githubusercontent.com) para evitar ese problema.
   ---------------------------------------------------------------- */
let _robotoJsPdfReady = null;   // null = no iniciado, Promise = en curso/resuelto

async function ensureRobotoInJsPDF(pdf) {
  // Memoizar: si ya lo intentamos (éxito o fallo), no repetir.
  if (_robotoJsPdfReady === null) {
    _robotoJsPdfReady = (async () => {
      try {
        // Helper: descarga un TTF desde URL y lo devuelve como base64
        async function fetchTtfBase64(url) {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`HTTP ${resp.status} al cargar ${url}`);
          const buf = await resp.arrayBuffer();
          let binary = '';
          const bytes = new Uint8Array(buf);
          // Convertir en bloques para no colapsar el stack con strings largas
          const CHUNK = 8192;
          for (let i = 0; i < bytes.byteLength; i += CHUNK) {
            binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
          }
          return btoa(binary);
        }

        // TTFs de Roboto desde el repo oficial de Google Fonts en GitHub.
        // Son los mismos binarios que sirve fonts.gstatic.com pero en TTF,
        // formato que jsPDF puede embeber sin generar warnings en Acrobat.
        const BASE = 'https://raw.githubusercontent.com/google/fonts/main/apache/roboto/static/';
        const [b64Regular, b64Bold] = await Promise.all([
          fetchTtfBase64(BASE + 'Roboto-Regular.ttf'),
          fetchTtfBase64(BASE + 'Roboto-Bold.ttf')
        ]);

        // Registrar ambas variantes en la instancia global de jsPDF.
        // addFileToVFS registra el binario; addFont lo asocia a un nombre.
        // Cada instancia de jsPDF (new _jsPDF(...)) hereda el VFS global
        // del prototipo, así que esto vale para todo el export.
        pdf.addFileToVFS('Roboto-Regular.ttf', b64Regular);
        pdf.addFont('Roboto-Regular.ttf', 'Roboto', 'normal');
        pdf.addFileToVFS('Roboto-Bold.ttf', b64Bold);
        pdf.addFont('Roboto-Bold.ttf', 'Roboto', 'bold');

        console.log('[PDF] Roboto TTF registrada en jsPDF OK — sin warnings de /BBox');
        return true;
      } catch(err) {
        console.warn('[PDF] No se pudo cargar Roboto en jsPDF, usando Helvetica como fallback:', err);
        return false;
      }
    })();
  }
  return _robotoJsPdfReady;
}

const INVISIBLE_TEXT_SELECTORS = [
  '.titulo-stock',
  '.leuk-logo-txt',
  '.leuk-logo-sub',
  '.sec-part-bold',
  '.sec-part-semibold',
  '.sec-part-light',
  '.sec-part-sep',
  '.banner-nuevos',
  '.badge-nuevo',
  '.badge-descontinuado',
  '.badge-disp',
  '.ref-disp-titulo',
  '.ref-disp-txt',
  '.sub-header-txt',
  '.prod-name',
  '.prod-sku'
].join(',');

/* ----------------------------------------------------------------
   LINKS INTERNOS EN EL PDF (notas interactivas)
   ----------------------------------------------------------------
   Se resuelven en DOS PASADAS porque un link puede apuntar hacia
   adelante, a una página que todavía no existe cuando se dibuja la
   página de origen.

     Pasada 1 (durante el loop de export): se anota el rectángulo
       clickeable de cada nota, en mm y ya referido a su página.
     Pasada 2 (una vez creadas todas las hojas): se resuelve el destino
       a página + Y y se escriben las anotaciones /Link.

   Detalle fino de jsPDF 2.5.1: para el destino se usa magFactor 'FitH',
   que escribe el valor de `top` CRUDO en el PDF. Los otros modos pasan
   por getVerticalCoordinate(), que convierte usando el alto de la página
   ACTIVA en el momento de guardar — y acá las hojas tienen alto variable,
   así que esa conversión daría destinos corridos. Con 'FitH' calculamos
   nosotros el punto exacto contra el alto de la hoja destino.
   ---------------------------------------------------------------- */
function recolectarLinksNota(block, blockOffsetYmm, pageWmm, pageNumber, out) {
  if (!block || !block.querySelectorAll) return;
  const blockRect = block.getBoundingClientRect();
  if (blockRect.width <= 0) return;
  const mmPerPx = pageWmm / blockRect.width;

  // Un poco de área extra alrededor del texto: el target real de click en
  // un visor de PDF conviene que sea algo más generoso que el glifo.
  const PAD_MM = 1.2;

  block.querySelectorAll('.prod-nota-link').forEach(el => {
    const destinos = (el.dataset.destinos || '').split(',').filter(Boolean);
    if (!destinos.length) return;
    const r = el.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    out.push({
      pageNumber,
      x: (r.left - blockRect.left) * mmPerPx - PAD_MM,
      y: (r.top  - blockRect.top ) * mmPerPx + blockOffsetYmm - PAD_MM,
      w: r.width  * mmPerPx + PAD_MM * 2,
      h: r.height * mmPerPx + PAD_MM * 2,
      destinos,
      modo: el.dataset.modo || 'seccion'
    });
  });
}

function aplicarLinksNota(pdf, links, blockPos, pageHeights, pageWmm) {
  if (!links || !links.length) return 0;
  const SF = pdf.internal.scaleFactor;      // mm → pt
  const MARGEN_MM = 4;                      // aire arriba del destino
  let aplicados = 0;

  for (const L of links) {
    const destino = destinoDeNota(L.destinos, L.modo);
    if (!destino) continue;
    const pos = blockPos.get(destino.bloque);
    if (!pos) continue;
    const hDestMm = pageHeights[pos.page];
    if (!hDestMm) continue;

    // Desplazamiento del ancla DENTRO de su bloque. En modo 'seccion' el
    // ancla es el bloque mismo, así que da 0 y se aterriza en el título.
    // En modo 'producto' da la altura hasta la tarjeta del PRISMA.
    const bRect = destino.bloque.getBoundingClientRect();
    let offsetMm = 0;
    if (bRect.width > 0 && destino.ancla !== destino.bloque) {
      const aRect = destino.ancla.getBoundingClientRect();
      offsetMm = (aRect.top - bRect.top) * (pageWmm / bRect.width);
    }

    // Y destino medida desde el TOPE de la hoja → punto PDF desde abajo
    const yDestMm = Math.max(0, pos.yMm + offsetMm - MARGEN_MM);
    const topPt   = (hDestMm - yDestMm) * SF;

    // setPage antes de link(): el rectángulo de origen se convierte contra
    // el alto de la página activa, y acá cada hoja mide distinto.
    pdf.setPage(L.pageNumber);
    pdf.link(L.x, L.y, L.w, L.h, {
      pageNumber: pos.page,
      magFactor: 'FitH',
      top: topPt
    });
    aplicados++;
  }
  console.log(`[PDF] links internos escritos: ${aplicados} / ${links.length}`);
  return aplicados;
}

function addInvisibleTextLayer(pdf, block, blockOffsetYmm, pageWmm, robotoAvailable) {
  if (!block || !block.getBoundingClientRect) return;
  const blockRect = block.getBoundingClientRect();
  if (blockRect.width <= 0) return;

  const mmPerPx = pageWmm / blockRect.width;

  // Recolectar elementos de texto. Si el bloque mismo coincide
  // con uno de los selectores (ej. un header de sección), también
  // lo incluimos.
  const els = Array.from(block.querySelectorAll(INVISIBLE_TEXT_SELECTORS));
  if (block.matches && block.matches(INVISIBLE_TEXT_SELECTORS)) {
    els.unshift(block);
  }

  for (const el of els) {
    // Filtrar elementos no visibles o sin texto
    const text = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!text) continue;
    const r = el.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) continue;

    const xPx = r.left - blockRect.left;
    const yPx = r.top  - blockRect.top;
    const wPx = r.width;
    const hPx = r.height;

    const xMm = xPx * mmPerPx;
    const yMm = yPx * mmPerPx + blockOffsetYmm;
    const wMm = wPx * mmPerPx;
    const hMm = hPx * mmPerPx;

    // Tomar font-size del estilo computado y convertir a pt
    // (jsPDF usa pt para setFontSize: 1pt = 1/72 inch = 25.4/72 mm)
    const styles = window.getComputedStyle(el);
    const fontSizePx = parseFloat(styles.fontSize) || 10;
    const fontSizeMm = fontSizePx * mmPerPx;
    const fontSizePt = fontSizeMm * 72 / 25.4;

    pdf.setFontSize(fontSizePt);

    // Seleccionar fuente: Roboto si está disponible, Helvetica como fallback.
    // Detectar bold según font-weight computado (≥ 600 → bold).
    if (robotoAvailable) {
      const fw = parseInt(styles.fontWeight) || 400;
      const style = fw >= 600 ? 'bold' : 'normal';
      pdf.setFont('Roboto', style);
    } else {
      pdf.setFont('helvetica', 'normal');
    }

    // text-align del DOM → align de jsPDF
    const ta = styles.textAlign || 'left';
    let alignX, align;
    if (ta === 'center' || ta === '-webkit-center') {
      alignX = xMm + wMm / 2; align = 'center';
    } else if (ta === 'right' || ta === 'end') {
      alignX = xMm + wMm; align = 'right';
    } else {
      alignX = xMm; align = 'left';
    }

    // Soporte de multilínea: usamos splitTextToSize de jsPDF que
    // hace word-wrap según ancho disponible. Si el texto cabe en
    // una sola línea, devuelve un array de 1.
    let lines;
    try {
      lines = pdf.splitTextToSize(text, Math.max(wMm, fontSizeMm));
    } catch(e) {
      lines = [text];
    }
    if (!Array.isArray(lines)) lines = [lines];

    // Altura de línea: usamos line-height computado del CSS si está
    // disponible, sino 1.2 × font-size (default tipográfico estándar).
    let lineHeightMm;
    const lh = styles.lineHeight;
    if (lh && lh !== 'normal' && !isNaN(parseFloat(lh))) {
      lineHeightMm = parseFloat(lh) * mmPerPx;
    } else {
      lineHeightMm = fontSizeMm * 1.2;
    }

    // Si CSS sólo tiene una línea pero splitTextToSize devolvió
    // varias, distribuirlas verticalmente dentro de hMm.
    // Baseline de la primera línea ≈ top + ascent ≈ top + 0.8 × fontSize
    // (aproximación que funciona bien para sans-serif).
    const ascentMm = fontSizeMm * 0.8;

    // Si solo hay 1 línea y el bloque DOM tiene altura mayor que la fuente,
    // centramos verticalmente para que la selección caiga sobre el texto
    // visible (importante para tarjetas donde el texto tiene padding).
    let firstBaselineY;
    if (lines.length === 1 && hMm > fontSizeMm * 1.4) {
      firstBaselineY = yMm + hMm / 2 + ascentMm / 2;
    } else {
      firstBaselineY = yMm + ascentMm;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = String(lines[i] || '');
      if (!line) continue;
      try {
        // CLAVE: renderingMode='invisible' debe pasarse en CADA llamada a
        // pdf.text(). El método global pdf.setTextRenderingMode(3) NO
        // funciona porque jsPDF genera un nuevo bloque BT/ET en cada
        // text() y solo respeta options.renderingMode adentro de ese
        // bloque. Verificado en el código fuente de jspdf 2.5.1:
        // text() lee `i.renderingMode` y emite `3 Tr` solo si está
        // presente, ignorando cualquier seteo global previo.
        pdf.text(line, alignX, firstBaselineY + i * lineHeightMm, {
          align,
          renderingMode: 'invisible'
        });
      } catch(e) { /* defensive: nunca abortar PDF por un texto raro */ }
    }
  }
}

/* ----------------------------------------------------------------
   GENERAR JPG (ZIP) — UN JPG POR HOJA, 300 DPI
   ----------------------------------------------------------------
   Mismo motor de segmentación que generatePDF:
     - Cada segmento manual (separado por .pdf-page-break) es UNA hoja.
     - Cada hoja sale como un .jpg dentro de un .zip.
     - Ancho de hoja = 210mm (A4 width), alto = variable según contenido.
     - Resolución: 300 DPI reales. Para A4 (210mm) eso son 2480 px de ancho.
       Calculamos el scale exacto de html2canvas para llegar a ese ancho
       desde el tamaño en pixels del #pdf-area.
     - Después de renderizar el JPG con canvas.toBlob, parcheamos el
       header JFIF para que el archivo declare 300 DPI (los navegadores
       guardan los JPGs como 72 DPI por defecto, lo que confunde a
       Photoshop/InDesign aunque los píxeles sean los correctos).
   ---------------------------------------------------------------- */
async function generateJPGs() {
  showOverlay('GENERANDO JPGs', 'Preparando exportación…', false);
  const btn = document.getElementById('btn-jpg');
  if (btn) btn.disabled = true;
  // También deshabilitamos el de PDF mientras se procesa (mismo motor)
  const btnPdf = document.getElementById('btn-pdf');
  if (btnPdf) btnPdf.disabled = true;

  const el = document.getElementById('pdf-area');

  const _html2canvas = window.html2canvas
                    || (window.html2pdf && window.html2pdf.html2canvas);
  const _JSZip = window.JSZip;
  if (!_html2canvas || !_JSZip) {
    const missing = [];
    if (!_html2canvas) missing.push('html2canvas');
    if (!_JSZip) missing.push('JSZip');
    alert(
      'No se pudieron cargar las librerías de JPG/ZIP (' + missing.join(', ') + ').\n\n' +
      'Posibles causas:\n' +
      '• Estás abriendo el archivo sin conexión a internet (las librerías se descargan de un CDN la primera vez).\n' +
      '• Un bloqueador de scripts está bloqueando cdnjs.cloudflare.com.\n\n' +
      'Solución: refrescá la página estando conectado a internet.'
    );
    if (btn) btn.disabled = false;
    if (btnPdf) btnPdf.disabled = false;
    hideOverlay();
    return;
  }

  deselectCard();
  const teniaGuides = el.classList.contains('show-guides');
  if (teniaGuides) el.classList.remove('show-guides');

  try {
    // 1) Esperar imágenes (mismo waitForAllImages que el PDF)
    showOverlay('GENERANDO JPGs', 'Esperando que carguen todas las fotos…', false);
    await waitForAllImages(el);

    // 1.bis) Esperar tipografías (mismo motivo y misma función que el PDF).
    //        Ver comentario completo en la definición de waitForAllFonts().
    showOverlay('GENERANDO JPGs', 'Esperando que carguen las tipografías…', false);
    await waitForAllFonts();

    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 80)));

    // 2) Segmentar igual que el PDF (cortes manuales = una hoja c/u)
    const segments = [];
    let current = [];
    for (const child of Array.from(el.children)) {
      if (child.classList && child.classList.contains('pdf-page-break')) {
        if (current.length) segments.push(current);
        current = [];
        continue;
      }
      if (child.classList && child.classList.contains('insert-break-zone')) continue;
      if (child.id === 'photo-flash') continue;
      current.push(child);
    }
    if (current.length) segments.push(current);
    if (segments.length === 0) throw new Error('No hay contenido para exportar.');

    // 3) Activar modo export (oculta toolbars, etc — igual que el PDF)
    el.classList.add('exporting');

    // 4) Calcular SCALE para llegar a 300 DPI a 210mm de ancho.
    //    El #pdf-area mide N px en pantalla. Esos N px se mapean a 210mm
    //    en la hoja final. Para que la hoja tenga 300 DPI:
    //      ancho_target_px = 210mm / 25.4 * 300 = 2480 px
    //      scale = 2480 / N
    const TARGET_DPI = 300;
    const PAGE_W_MM = 210;
    const TARGET_W_PX = Math.round(PAGE_W_MM / 25.4 * TARGET_DPI); // 2480
    const baseWpx = el.offsetWidth;
    const SCALE = TARGET_W_PX / baseWpx;

    const zip = new _JSZip();
    const totalBlocks = segments.reduce((s, seg) => s + seg.length, 0);
    let renderedBlocks = 0;

    showOverlay('GENERANDO JPGs', `Hoja 0 / ${segments.length}…`, true);

    // 5) Procesar segmento por segmento
    for (let si = 0; si < segments.length; si++) {
      const seg = segments[si];

      // 5.1) Renderizar bloques del segmento (mismo patrón que PDF
      //      pero con scale apuntando a 300 DPI exactos)
      const blockCanvases = [];
      for (let bi = 0; bi < seg.length; bi++) {
        const block = seg[bi];
        const canvas = await _html2canvas(block, {
          scale: SCALE,
          useCORS: true,
          allowTaint: true,
          logging: false,
          backgroundColor: '#ffffff',
          imageTimeout: 15000
        });
        blockCanvases.push(canvas);
        renderedBlocks++;
        const pct = Math.round((renderedBlocks / totalBlocks) * 90); // dejamos 10% para zip
        updateOverlayProgress(pct,
          `Hoja ${si + 1} / ${segments.length} — bloque ${bi + 1} / ${seg.length}…`);
        await new Promise(r => setTimeout(r, 0));
      }

      // 5.2) Componer todos los canvases del segmento en uno solo
      //      (concatenación vertical). Esto es la "hoja" final.
      const W = blockCanvases[0].width;
      const totalH = blockCanvases.reduce((s, c) => s + c.height, 0);

      // Defensivo: si el resultado excede el límite de canvas del browser
      // (típicamente 16384px de lado en Chrome/Firefox), abortamos con
      // un mensaje claro para que el usuario meta más cortes manuales.
      const MAX_CANVAS_SIDE = 16384;
      if (totalH > MAX_CANVAS_SIDE) {
        throw new Error(
          `La hoja ${si + 1} es demasiado larga (${totalH}px) para exportar a 300 DPI.\n` +
          `Insertá un corte manual ("+ insertar corte") en algún punto intermedio ` +
          `para dividirla en hojas más cortas.`
        );
      }

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = W;
      finalCanvas.height = totalH;
      const ctx = finalCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, totalH);
      let y = 0;
      for (const c of blockCanvases) {
        ctx.drawImage(c, 0, y);
        y += c.height;
      }

      // 5.3) Convertir a JPG (calidad 0.92 igual que el PDF) e inyectar
      //      la metadata de 300 DPI en el header JFIF.
      const blob = await new Promise(res =>
        finalCanvas.toBlob(res, 'image/jpeg', 0.92)
      );
      const arrayBuf = await blob.arrayBuffer();
      const u8 = new Uint8Array(arrayBuf);
      const u8WithDpi = setJPEGDensity(u8, TARGET_DPI);

      // 5.4) Agregar al zip. Nombre con padding cero (hoja_01, hoja_02…)
      //      para que el orden alfabético = orden de hojas.
      const pad = String(si + 1).padStart(2, '0');
      const filename = `LEUK_Stock_${fechaISO()}_hoja_${pad}.jpg`;
      zip.file(filename, u8WithDpi);

      // Liberar memoria del canvas (importante con 300 DPI: cada hoja
      // puede pesar 50-100MB en RAM si es larga)
      finalCanvas.width = 0; finalCanvas.height = 0;
      for (const c of blockCanvases) { c.width = 0; c.height = 0; }
    }

    // 6) Generar el zip y descargarlo
    updateOverlayProgress(92, 'Comprimiendo ZIP…');
    const zipBlob = await zip.generateAsync(
      { type: 'blob', compression: 'STORE' }, // JPGs ya están comprimidos,
      // STORE evita CPU innecesaria sin reducir tamaño significativo
      (meta) => {
        // meta.percent: 0–100 del proceso de zipear
        const pct = 92 + Math.round(meta.percent * 0.08);
        updateOverlayProgress(pct, `Comprimiendo ZIP… ${Math.round(meta.percent)}%`);
      }
    );

    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `LEUK_Stock_${fechaISO()}_JPGs.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Pequeña espera antes de revocar la URL (algunos browsers necesitan
    // que el download tag haya disparado el blob)
    setTimeout(() => URL.revokeObjectURL(url), 4000);

  } catch(err) {
    console.error('[JPG]', err);
    alert('Error generando JPGs: ' + ((err && err.message) || err));
  } finally {
    el.classList.remove('exporting');
    if (teniaGuides) el.classList.add('show-guides');
    hideOverlay();
    if (btn) btn.disabled = false;
    if (btnPdf) btnPdf.disabled = false;
  }
}

/* ----------------------------------------------------------------
   PARCHE JFIF: SET 300 DPI EN UN JPEG
   ----------------------------------------------------------------
   Un JPEG generado por canvas.toBlob suele venir con un APP0/JFIF
   declarando 72 DPI (o units=0 = "aspect ratio sin DPI"). Esto
   confunde a Photoshop/InDesign/Illustrator: el archivo aparece
   con las dimensiones físicas erradas aunque los píxeles sean los
   correctos. La solución estándar es modificar 5 bytes del header:
     - byte de "units" → 0x01 (DPI)
     - 2 bytes Xdensity → dpi (big-endian)
     - 2 bytes Ydensity → dpi (big-endian)
   Si el JPEG no tiene segmento JFIF, lo insertamos justo después
   del marcador SOI (FFD8).
   Referencia: https://www.w3.org/Graphics/JPEG/jfif3.pdf §A.1
   ---------------------------------------------------------------- */
function setJPEGDensity(u8, dpi) {
  // Validar SOI
  if (u8.length < 4 || u8[0] !== 0xFF || u8[1] !== 0xD8) return u8;
  const dpiHi = (dpi >> 8) & 0xFF;
  const dpiLo = dpi & 0xFF;

  // Caso A: ya hay un APP0/JFIF justo después del SOI (lo más común).
  // Estructura: FF E0 [len:2] "JFIF\0" [v1:1] [v2:1] [units:1] [Xden:2] [Yden:2] ...
  if (u8[2] === 0xFF && u8[3] === 0xE0 && u8.length >= 20 &&
      u8[6] === 0x4A && u8[7] === 0x46 && u8[8] === 0x49 && u8[9] === 0x46 && u8[10] === 0x00) {
    const out = new Uint8Array(u8);
    out[13] = 0x01;      // units = DPI
    out[14] = dpiHi;     // Xdensity high
    out[15] = dpiLo;     // Xdensity low
    out[16] = dpiHi;     // Ydensity high
    out[17] = dpiLo;     // Ydensity low
    return out;
  }

  // Caso B: no hay JFIF. Insertarlo entre SOI y el resto del archivo.
  const jfif = new Uint8Array([
    0xFF, 0xE0,                  // APP0
    0x00, 0x10,                  // length = 16
    0x4A, 0x46, 0x49, 0x46, 0x00,// "JFIF\0"
    0x01, 0x01,                  // version 1.01
    0x01,                        // units = DPI
    dpiHi, dpiLo,                // Xdensity
    dpiHi, dpiLo,                // Ydensity
    0x00, 0x00                   // Xthumbnail, Ythumbnail
  ]);
  const out = new Uint8Array(2 + jfif.length + (u8.length - 2));
  out[0] = 0xFF; out[1] = 0xD8;
  out.set(jfif, 2);
  out.set(u8.subarray(2), 2 + jfif.length);
  return out;
}

/* ----------------------------------------------------------------
   INIT
   ---------------------------------------------------------------- */
initFecha();        // Carga la fecha guardada o pone hoy como default
updateFotosPill();
restoreFamilias();  // Restaura el archivo de organización si está guardado
render();
// Restaurar logo + fuentes guardadas (async, no bloquea el render inicial)
restoreCustom();

// Datos en vivo: stock de la web, HUB, maestro de ventiladores y fotos del Drive.
setTimeout(() => { actualizarDesdeLaNube().catch(e => console.error('[NUBE]', e)); }, 50);

// WARMUP de tipografías: disparar el download en background apenas
// se abre la página, para que estén en caché cuando el usuario
// aprete "GENERAR PDF/JPG". No bloquea nada — los export ya tienen
// su propio waitForAllFonts() de salvataje. Esto es pura optimización
// de UX: elimina el delay perceptible del primer export.
if (document.fonts && document.fonts.load) {
  FONTS_CRITICAS.forEach(spec => {
    document.fonts.load(spec).catch(() => {});
  });
}
</script>
