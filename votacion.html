<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación — Packaging Leuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --olive:#676B55;--olive-mid:#8B9174;--olive-soft:#B6BAA4;--olive-pale:#EEF0E8;
  --ink:#2b2c26;--gray:#4D4D4D;--gray-soft:#8a8c82;--line:#e4e6dd;--bg:#fbfbf9;--card:#fff;
  --ok:#4f7a3f;--radius:14px;--shadow:0 1px 3px rgba(40,42,34,.06),0 6px 20px rgba(40,42,34,.05);
  --font-title:"Barlow Condensed","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --font-body:"Barlow","Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:var(--font-title);font-size:26px;margin:0 0 4px;letter-spacing:.005em}
.sub{color:var(--gray-soft);font-size:13.5px;margin:0 0 26px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;letter-spacing:.02em}
.pill-open{background:var(--olive-pale);color:var(--olive)}
.pill-closed{background:#f3e9df;color:#b7893b}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
section.cat{margin-bottom:34px}
.cat h2{font-family:var(--font-title);font-size:19px;margin:0 0 3px}
.cat p.hint{color:var(--gray-soft);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:600px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .15s,transform .1s;text-align:center}
.opt:hover{border-color:var(--olive-soft)}
.opt.sel{border-color:var(--olive)}
.opt img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:var(--olive-pale);margin-bottom:8px}
.opt .ph{width:100%;aspect-ratio:1/1;border-radius:8px;background:var(--olive-pale);margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;color:var(--gray-soft);font-family:var(--font-title);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.opt .lbl{font-weight:600;font-size:13.5px}
.opt .dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--olive-soft);margin-bottom:6px}
.opt.sel .dot{background:var(--olive);border-color:var(--olive)}
.actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(251,251,249,0),var(--bg) 30%);padding:22px 0 6px;display:flex;gap:10px;align-items:center}
.btn{font-family:var(--font-body);font-weight:600;font-size:14px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:disabled{background:var(--olive-soft);cursor:not-allowed}
.btn-primary:not(:disabled):hover{background:#565a46}
.btn-link{background:none;color:var(--gray);font-weight:500;text-decoration:underline;padding:12px 4px}
.msg{font-size:13px;color:var(--gray-soft)}
.thanks{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;text-align:center;margin-top:8px}
.thanks .big{font-size:34px;margin-bottom:6px}
.thanks h3{font-family:var(--font-title);font-size:20px;margin:0 0 6px}
.thanks p{color:var(--gray-soft);font-size:13.5px;margin:0 0 16px}
.results h2{font-family:var(--font-title);font-size:19px;margin:0 0 12px}
.bar-row{margin-bottom:12px}
.bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-row .top b{font-weight:600}
.bar-track{background:var(--olive-pale);border-radius:999px;height:12px;overflow:hidden}
.bar-fill{background:var(--olive);height:100%;border-radius:999px;transition:width .5s ease}
.bar-fill.win{background:var(--ok)}
.admin-box{margin-top:36px;padding:16px 18px;border:1px dashed var(--olive-soft);border-radius:var(--radius);background:var(--olive-pale)}
.admin-box .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.admin-box h4{font-family:var(--font-title);font-size:15px;margin:0}
.admin-box .cnt{font-size:12.5px;color:var(--gray)}
.center{text-align:center;padding:60px 20px;color:var(--gray-soft)}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center" id="loading">Cargando votación…</div>
</div>

<script>
(function () {
  var SB_URL = "https://cswqoretlhppxkelysny.supabase.co";
  var SB_KEY = "sb_publishable_Rpbm5uyhUp8aTvoCnHylyA_B0wq8sRs";

  // Config de la votación: nombre de archivo por opción. Reemplazar cuando
  // estén las imágenes finales (img/votacion/trama-1.png ... etiqueta-2.png).
  var TRAMAS = [1, 2, 3, 4];
  var ETIQUETAS = [1, 2];

  function sesion() { try { return JSON.parse(localStorage.getItem("benchmark_leuk_sesion")); } catch (e) { return null; } }
  function token() { var s = sesion(); return s && s.access_token; }
  function miEmail() { var s = sesion(); return s && s.email; }
  // Puente hacia app.js (mismo origen, este archivo va embebido en un iframe de index.html):
  // ahí vive el rol real (viene de `perfiles` en Supabase) y el nombre para mostrar.
  function miRol() { try { return window.parent && window.parent.LEUK_SESION && window.parent.LEUK_SESION.rol(); } catch (e) { return null; } }
  function miNombre() { try { return (window.parent && window.parent.LEUK_SESION && window.parent.LEUK_SESION.nombre()) || null; } catch (e) { return null; } }
  function head(extra) {
    var h = { apikey: SB_KEY, Authorization: "Bearer " + token(), "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  async function sb(path, opts) {
    var r = await fetch(SB_URL + "/rest/v1/" + path, Object.assign({ headers: head(opts && opts.headers) }, opts || {}));
    if (!r.ok) throw new Error(await r.text());
    var txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }

  var state = { abierta: true, misVotos: {}, todos: [], rol: null, sel: {} };

  function esModerador() { return state.rol === "admin" || state.rol === "lider"; }

  async function cargar() {
    var estado = await sb("votacion_packaging_estado?select=abierta&id=eq.1");
    state.abierta = estado && estado[0] ? estado[0].abierta : true;
    state.rol = miRol();

    var email = miEmail();
    var mios = email ? await sb("votacion_packaging?select=categoria,opcion&autor_email=eq." + encodeURIComponent(email)) : [];
    (mios || []).forEach(function (v) { state.misVotos[v.categoria] = v.opcion; });
    state.sel = Object.assign({}, state.misVotos);

    if (!state.abierta || esModerador()) {
      state.todos = await sb("votacion_packaging?select=categoria,opcion,autor_email") || [];
    }
    render();
  }

  function opcionCard(categoria, n, seleccionada) {
    var etiqueta = categoria === "trama" ? "Trama " + n : "Etiqueta " + n;
    var archivo = "img/votacion/" + categoria + "-" + n + ".png";
    return '<div class="opt' + (seleccionada ? " sel" : "") + '" data-cat="' + categoria + '" data-n="' + n + '">' +
      '<img src="' + archivo + '" class="thumb" onerror="window.__imgFallback(this)">' +
      '<div class="lbl">' + etiqueta + '</div></div>';
  }
  // Mientras no estén las imágenes finales (o si falta alguna), la tarjeta muestra
  // el nombre de la opción en vez de un ícono roto.
  window.__imgFallback = function (img) {
    var ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = img.closest(".opt").querySelector(".lbl").textContent;
    img.replaceWith(ph);
  };

  function totales(categoria, opciones) {
    var counts = {}; opciones.forEach(function (n) { counts[n] = 0; });
    state.todos.filter(function (v) { return v.categoria === categoria; }).forEach(function (v) { counts[v.opcion] = (counts[v.opcion] || 0) + 1; });
    return counts;
  }

  function renderResultados(categoria, opciones, titulo) {
    var counts = totales(categoria, opciones);
    var total = Object.values(counts).reduce(function (a, b) { return a + b; }, 0) || 1;
    var max = Math.max.apply(null, Object.values(counts));
    var rows = opciones.map(function (n) {
      var c = counts[n] || 0, pct = Math.round(c / total * 100);
      var esGanadora = c === max && max > 0;
      return '<div class="bar-row"><div class="top"><span>' + (categoria === "trama" ? "Trama " : "Etiqueta ") + n + '</span><b>' + c + ' voto' + (c === 1 ? "" : "s") + ' · ' + pct + '%</b></div>' +
        '<div class="bar-track"><div class="bar-fill' + (esGanadora ? " win" : "") + '" style="width:' + pct + '%"></div></div></div>';
    }).join("");
    return '<div class="results"><h2>' + titulo + '</h2>' + rows + '</div>';
  }

  async function votar() {
    var email = miEmail();
    if (!email || !state.sel.trama || !state.sel.etiqueta) return;
    var btn = document.getElementById("btnVotar");
    if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
    try {
      await sb("votacion_packaging", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([
          { categoria: "trama", opcion: state.sel.trama, autor_email: email, autor_nombre: miNombre() },
          { categoria: "etiqueta", opcion: state.sel.etiqueta, autor_email: email, autor_nombre: miNombre() },
        ]),
      });
      state.misVotos = Object.assign({}, state.sel);
      await cargar();
    } catch (e) {
      alert("No se pudo guardar tu voto. Probá de nuevo.");
      if (btn) { btn.disabled = false; btn.textContent = "Enviar mi voto"; }
    }
  }

  async function cerrarVotacion() {
    if (!confirm("¿Cerrar la votación? Los resultados quedarán visibles para todo el equipo.")) return;
    try {
      await sb("votacion_packaging_estado?id=eq.1", {
        method: "PATCH",
        headers: { Prefer: "return=minimal" },
        body: JSON.stringify({ abierta: false, cerrada_por: miEmail(), cerrada_en: new Date().toISOString() }),
      });
      await cargar();
    } catch (e) {
      alert("No se pudo cerrar la votación. Probá de nuevo.");
    }
  }

  function render() {
    var yaVoto = state.misVotos.trama && state.misVotos.etiqueta;
    var root = document.getElementById("root");
    var pill = state.abierta
      ? '<span class="pill pill-open"><span class="d"></span>Votación abierta</span>'
      : '<span class="pill pill-closed"><span class="d"></span>Votación cerrada</span>';

    var html = '<h1>Votación de packaging</h1>' +
      '<p class="sub">' + pill + '&nbsp;&nbsp;Una trama y una etiqueta para las próximas cajas de Leuk. Un voto por persona.</p>';

    if (!state.abierta) {
      html += renderResultados("trama", TRAMAS, "¿Qué trama representa mejor a Leuk Iluminación?");
      html += renderResultados("etiqueta", ETIQUETAS, "Etiqueta para cajas (inner + master)");
    } else if (yaVoto && !esModerador()) {
      html += '<div class="thanks"><div class="big">🗳️</div><h3>¡Gracias por votar!</h3>' +
        '<p>Tu voto quedó guardado: Trama ' + state.misVotos.trama + ' · Etiqueta ' + state.misVotos.etiqueta + '. Los resultados se muestran cuando se cierre la votación.</p>' +
        '<button class="btn btn-link" id="btnCambiar">Cambiar mi voto</button></div>';
    } else {
      html += '<section class="cat"><h2>¿Qué trama representa mejor a Leuk Iluminación?</h2><p class="hint">Elegí una.</p>' +
        '<div class="grid g4" id="gridTrama">' + TRAMAS.map(function (n) { return opcionCard("trama", n, state.sel.trama === n); }).join("") + '</div></section>' +
        '<section class="cat"><h2>Etiqueta para cajas (inner + master)</h2><p class="hint">Elegí una.</p>' +
        '<div class="grid" id="gridEtiqueta">' + ETIQUETAS.map(function (n) { return opcionCard("etiqueta", n, state.sel.etiqueta === n); }).join("") + '</div></section>' +
        '<div class="actions"><button class="btn btn-primary" id="btnVotar" ' + (state.sel.trama && state.sel.etiqueta ? "" : "disabled") + '>Enviar mi voto</button>' +
        '<span class="msg">' + (state.sel.trama && state.sel.etiqueta ? "" : "Elegí una trama y una etiqueta") + '</span></div>';
    }

    if (esModerador()) {
      var counts = state.todos.length;
      var votantes = {}; state.todos.forEach(function (v) { votantes[v.autor_email] = 1; });
      html += '<div class="admin-box"><div class="top"><h4>Panel de moderación</h4>' +
        (state.abierta ? '<button class="btn btn-primary" id="btnCerrar" style="padding:8px 16px;font-size:12.5px">Cerrar votación y mostrar resultados</button>' : '') +
        '</div><p class="cnt">' + Object.keys(votantes).length + ' persona(s) votaron hasta ahora · ' + counts + ' votos totales.</p>' +
        (state.abierta ? renderResultados("trama", TRAMAS, "Parcial — Trama (sólo vos lo ves)") + renderResultados("etiqueta", ETIQUETAS, "Parcial — Etiqueta (sólo vos lo ves)") : '') +
        '</div>';
    }

    root.innerHTML = html;

    root.querySelectorAll(".opt").forEach(function (el) {
      el.addEventListener("click", function () {
        var cat = el.dataset.cat, n = parseInt(el.dataset.n, 10);
        state.sel[cat] = n;
        render();
      });
    });
    var bv = document.getElementById("btnVotar"); if (bv) bv.addEventListener("click", votar);
    var bc = document.getElementById("btnCerrar"); if (bc) bc.addEventListener("click", cerrarVotacion);
    var bx = document.getElementById("btnCambiar"); if (bx) bx.addEventListener("click", function () { state.misVotos = {}; render(); });
  }

  if (!token()) {
    document.getElementById("root").innerHTML = '<div class="center">Iniciá sesión en la plataforma para votar.</div>';
  } else {
    cargar().catch(function () {
      document.getElementById("root").innerHTML = '<div class="center">No se pudo cargar la votación (¿sesión vencida?). Volvé a entrar a la plataforma y probá de nuevo.</div>';
    });
  }
})();
</script>
</body>
</html>
